<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="short.css" />
<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
/*
 * Snow totals (29 s). DATA:
 *   { states, logo, date: "Wednesday, January 22",
 *     reports: [{ in, lat, lon }],                         (smallest first)
 *     counts: { total, inch, six, foot },
 *     top: [{ value: "10 in", inches, place, lat, lon }],  (biggest first)
 *     topStates: ["Florida", "Alabama"] }
 */
const { ctx, D, C, PANEL, clamp, seg, easeOut, easeInOut, rr, text, fitSize } = SC;
const map = SC.makeMap(SC.usProjection(), { source: "Source: NWS local storm reports via IEM" });

// The NWS snowfall colours (inches), as on its storm total maps.
const SCALE = [
  [0.1, "#bdd7e7"], [1, "#6baed6"], [2, "#3182bd"], [3, "#08519c"], [4, "#082694"], [6, "#ffff96"],
  [8, "#ffc400"], [12, "#ff8700"], [18, "#db1400"], [24, "#9e0000"], [30, "#690000"], [36, "#360000"], [48, "#cccbff"],
];
const colorOf = (v) => { let c = SCALE[0][1]; for (const [at, col] of SCALE) if (v >= at) c = col; return c; };

// The reports' extent, without the odd outlier far from the rest dragging the camera out.
const reports = D.reports;
const lons = reports.map((r) => r.lon).sort((a, b) => a - b), lats = reports.map((r) => r.lat).sort((a, b) => a - b);
const q = (arr, p) => arr[Math.min(arr.length - 1, Math.max(0, Math.round((arr.length - 1) * p)))];
const lo = reports.length > 12 ? 0.03 : 0, hi = 1 - lo;
const fitted = reports.length
  ? map.fit({ type: "MultiPoint", coordinates: [[q(lons, lo) - 1, q(lats, lo) - 0.8], [q(lons, hi) + 1, q(lats, hi) + 0.8]] }, { frac: 0.8, maxK: 3 })
  : map.home;
// Centred in the part of the map under the colour scale (LEGEND_H px at the top).
const LEGEND_H = 96;
const zoomed = { k: fitted.k, c: [fitted.c[0], fitted.c[1] - LEGEND_H / 2 / fitted.k] };

// The map fills in from the smallest totals to the biggest over 5-12 s.
const PLAY0 = 5.0, PLAY1 = 12.0;
reports.forEach((r, i) => (r.at = PLAY0 + (i / Math.max(reports.length - 1, 1)) * (PLAY1 - PLAY0 - 0.5)));
const shownMax = (t) => { let m = 0; for (const r of reports) if (t >= r.at) m = Math.max(m, r.in); return m; };

// Then the biggest totals, one row at a time, the camera on the top one.
const TOP0 = 12.8, ROW = 0.9;
// Not `top`: that's window.top.
const best = D.top;
const END = Math.max(TOP0 + best.length * ROW + 5.2, 21.5);

function drawDot(x, y, v, a, pop) {
  const s = (v >= 12 ? 11 : v >= 6 ? 9.5 : 8) * (1 + 0.8 * (1 - pop));
  ctx.save(); ctx.globalAlpha *= a;
  if (pop < 1) {
    ctx.save(); ctx.globalAlpha *= 1 - pop;
    ctx.beginPath(); ctx.arc(x, y, s + 26 * pop, 0, Math.PI * 2);
    ctx.strokeStyle = colorOf(v); ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2);
  ctx.fillStyle = colorOf(v); ctx.fill();
  // A light ring: the dark blues and reds of the scale would vanish on the dark map without it.
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.stroke();
  ctx.restore();
}

function dotsOverlay(t, cam) {
  for (const r of reports) {
    if (t < r.at) continue;
    const p = map.screen([r.lon, r.lat], cam);
    if (p) drawDot(p[0], p[1], r.in, easeOut(seg(t, r.at, r.at + 0.25)), easeOut(seg(t, r.at, r.at + 0.7)));
  }
}

/** The scale, under the map's top edge: only the steps up to the day's biggest total. */
function legend(t) {
  const a = easeOut(seg(t, 4.4, 5.0));
  if (a <= 0) return;
  const max = best[0] ? best[0].inches : 0;
  const steps = SCALE.filter(([at], i) => i === 0 || at <= max);
  const w = Math.min(84, 920 / steps.length), x0 = SC.MAP.x + SC.MAP.w - 30 - w * steps.length, y = SC.MAP.y + 24;
  ctx.save(); ctx.globalAlpha = a;
  rr(x0 - 16, y - 12, w * steps.length + 32, 78, 16); ctx.fillStyle = "rgba(3,6,13,0.72)"; ctx.fill();
  steps.forEach(([at, col], i) => {
    ctx.fillStyle = col; ctx.fillRect(x0 + i * w, y, w - 3, 22);
    text(at < 1 ? "T" : String(at), x0 + i * w + (w - 3) / 2, y + 54, { size: 22, weight: 600, color: C.ink2, align: "center" });
  });
  text("in", x0 - 30, y + 54, { size: 22, weight: 600, color: C.ink3, align: "right" });
  ctx.restore();
}

function countsPanel(t) {
  const a = easeOut(seg(t, 4.4, 5.0)) * (1 - easeOut(seg(t, TOP0 - 0.4, TOP0)));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const shown = t >= PLAY1 ? reports.length : reports.filter((r) => t >= r.at).length;
  text("Snowfall in the past 24 hours", PANEL.x + 10, PANEL.y + 46, { size: 34, weight: 500, color: C.ink2 });
  text(String(shown), PANEL.x + 10, PANEL.y + 160, { size: 108, weight: 800, spacing: -1 });
  ctx.font = `800 108px "SC Inter"`;
  const w = ctx.measureText(String(shown)).width;
  text(shown === 1 ? "place reporting snow" : "places reporting snow", PANEL.x + 30 + w, PANEL.y + 160, { size: fitSize("places reporting snow", PANEL.w - 60 - w, 44, 600), weight: 600, color: C.ink2 });
  const atLeast = (v, final) => String(t >= PLAY1 ? final : reports.filter((r) => r.in >= v && t >= r.at).length);
  // A foot or more when any place got one; after a smaller snow, the places with an inch.
  const third = D.counts.foot ? { name: "1 ft or more", value: atLeast(12, D.counts.foot), color: colorOf(12) } : { name: "1 in or more", value: atLeast(1, D.counts.inch), color: colorOf(1) };
  const boxes = [
    { name: "Up to", value: `${Math.round(shownMax(t) * 10) / 10} in`, color: colorOf(shownMax(t)) },
    { name: "6 in or more", value: atLeast(6, D.counts.six), color: colorOf(6) },
    third,
  ];
  boxes.forEach((b, i) => {
    const x = PANEL.x + i * 340, y = PANEL.y + 210;
    rr(x, y, 320, 150, 22); ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.line; ctx.stroke();
    // The colour on a swatch, the number in ink: the scale's dark blues and reds don't read as text.
    ctx.save(); rr(x, y, 320, 150, 22); ctx.clip(); ctx.fillStyle = b.color; ctx.fillRect(x, y, 10, 150); ctx.restore();
    text(b.name, x + 32, y + 52, { size: 30, weight: 600, color: C.ink2 });
    text(b.value, x + 32, y + 128, { size: fitSize(b.value, 270, 64, 800), weight: 800 });
  });
  ctx.restore();
}

function topPanel(t) {
  const a = easeOut(seg(t, TOP0, TOP0 + 0.5));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  text("Biggest totals", PANEL.x + 10, PANEL.y + 40, { size: 34, weight: 600, color: C.ink2 });
  const rowH = Math.min(72, 340 / Math.max(best.length, 1));
  best.forEach((r, i) => {
    const s = TOP0 + 0.3 + i * ROW, ra = easeOut(seg(t, s, s + 0.4));
    if (ra <= 0) return;
    const y = PANEL.y + 70 + i * rowH + (1 - ra) * 16;
    ctx.save(); ctx.globalAlpha *= ra;
    if (i === 0) { rr(PANEL.x, y, PANEL.w, rowH - 8, 16); ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fill(); }
    ctx.beginPath(); ctx.arc(PANEL.x + 34, y + (rowH - 8) / 2, 13, 0, Math.PI * 2); ctx.fillStyle = colorOf(r.inches); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.stroke();
    const base = y + (rowH - 8) / 2 + 15;
    text(r.value, PANEL.x + 66, base, { size: 44, weight: 800 });
    text(`near ${r.place}`, PANEL.x + 260, base, { size: fitSize(`near ${r.place}`, PANEL.w - 280, 38, 600), weight: 600, color: i === 0 ? C.ink : C.ink2 });
    ctx.restore();
  });
  ctx.restore();
}

/** The camera: the US, the reports from 3.6 s, the top total from TOP0, back out before the end card. */
function camera(t) {
  let cam = map.mix(map.home, zoomed, easeInOut(seg(t, 3.6, 5.0)));
  const p = best[0] ? map.projection([best[0].lon, best[0].lat]) : null;
  const k = Math.max(zoomed.k * 1.6, 3);
  if (p) cam = map.mix(cam, { k, c: [p[0], p[1] - LEGEND_H / 2 / k] }, easeInOut(seg(t, TOP0, TOP0 + 1.0)) * (1 - easeInOut(seg(t, END - 2.2, END - 1.0))));
  return cam;
}

function topMarker(t, cam) {
  if (!best[0]) return;
  const p = map.screen([best[0].lon, best[0].lat], cam);
  if (!p) return;
  const a = easeOut(seg(t, TOP0 + 0.8, TOP0 + 1.2)) * (1 - easeOut(seg(t, END - 2.2, END - 1.6)));
  if (a <= 0) return;
  const pulse = ((t - TOP0) % 1.1) / 1.1;
  ctx.save(); ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(p[0], p[1], 26, 0, Math.PI * 2); ctx.lineWidth = 5; ctx.strokeStyle = "#fff"; ctx.stroke();
  ctx.globalAlpha = a * (1 - pulse);
  ctx.beginPath(); ctx.arc(p[0], p[1], 26 + pulse * 46, 0, Math.PI * 2); ctx.lineWidth = 4; ctx.strokeStyle = colorOf(best[0].inches); ctx.stroke();
  ctx.restore();
}

window.render = function (t) {
  SC.background();
  SC.introRadar(t);
  const ma = easeOut(seg(t, 2.8, 3.6));
  if (ma > 0) {
    ctx.save(); ctx.globalAlpha = ma;
    const cam = camera(t);
    const zIn = easeInOut(seg(t, 3.6, 5.0));
    // City names fade while the map fills in (they'd hide the dots), back for the top totals.
    const cityA = zIn * 0.9 * (1 - easeOut(seg(t, PLAY0 + 0.6, PLAY0 + 1.4))) + 0.9 * easeOut(seg(t, TOP0, TOP0 + 0.8));
    map.draw(cam, [], (c) => {
      dotsOverlay(t, c);
      map.cities(c, cityA);
      topMarker(t, c);
    });
    legend(t);
    ctx.restore();
  }
  SC.header(t, { lines: ["Snow totals"], title: "Snow totals", date: D.date });
  countsPanel(t); topPanel(t);
  SC.endCard(t, END + 0.2, "Follow for snow totals after every storm");
};
window.DUR = Math.ceil(END + 6.4);
</script>
</body>
</html>
