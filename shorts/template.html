<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  /* Inter (variable, with optical sizes), so the runner needs no installed fonts. */
  @font-face { font-family: "SC Inter"; src: url("vendor/inter.woff2") format("woff2"); font-weight: 100 900; }
</style>
<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*
 * The daily outlook Short: 1080x1920, and render(t) draws the frame at t
 * seconds. shorts/render.ts injects DATA before the page loads:
 *   { states, cat, torn, wind, hail, logo,
 *     outlook: { risk: "Slight" | null, code: "SLGT" | null, level: 0-5, region, summary, date } }
 * Everything that matters stays above y = 1460: YouTube's buttons and
 * caption cover the bottom of a Short.
 */
const W = 1080, H = 1920, DUR = 33;
const ctx = document.getElementById("c").getContext("2d");
const D = window.DATA;
const logo = new Image();
logo.src = D.logo;

// ── helpers ──────────────────────────────────────────────────────────────
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a)); // 0..1 progress of t through [a, b]
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, x) => a + (b - a) * x;
const C = {
  bg: "#03060d", panel: "#0b1120", line: "rgba(255,255,255,0.10)", ink: "#f2f4f8", ink2: "#a9b1bf", ink3: "#7d8594",
  accent: "#5b9cf6", land: "#111a2c", state: "rgba(200,215,240,0.22)",
};
const RISK_COLORS = { MARGINAL: "#66A366", SLIGHT: "#FFE066", ENHANCED: "#FFA366", MODERATE: "#E06666", HIGH: "#EE99EE" };
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, { size = 40, weight = 600, color = C.ink, align = "left", family = "SC Inter", alpha = 1, spacing = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px "${family}"`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  if (spacing) ctx.letterSpacing = `${spacing}px`;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function wrap(s, maxW, font) {
  ctx.font = font;
  const words = s.split(/\s+/), lines = [];
  let line = "";
  for (const w of words) {
    const next = line ? `${line} ${w}` : w;
    if (ctx.measureText(next).width > maxW && line) { lines.push(line); line = w; } else line = next;
  }
  if (line) lines.push(line);
  return lines;
}

// ── map ──────────────────────────────────────────────────────────────────
const MAP = { x: 40, y: 330, w: 1000, h: 690 };
const states = topojson.feature(D.states, D.states.objects.states).features.filter((f) => !["02", "15", "72", "78", "60", "66", "69"].includes(f.id));
const nation = { type: "FeatureCollection", features: states };
const projection = d3.geoConicConformal().parallels([33, 45]).rotate([96, 0]).fitExtent([[MAP.x + 30, MAP.y + 40], [MAP.x + MAP.w - 30, MAP.y + MAP.h - 40]], nation);
const path = d3.geoPath(projection, ctx);
// Zoom target: the highest categorical risk's bounds.
const mapCenter = [MAP.x + MAP.w / 2, MAP.y + MAP.h / 2];
// Zoom target: the highest categorical risk's bounds (no zoom on a quiet day).
const topRisk = D.cat.features.filter((f) => f.properties.LABEL === D.outlook.code);
let zk = 1, zc = mapCenter;
if (topRisk.length) {
  const [[bx0, by0], [bx1, by1]] = d3.geoPath(projection).bounds({ type: "FeatureCollection", features: topRisk });
  zk = clamp(Math.min((MAP.w * 0.62) / (bx1 - bx0), (MAP.h * 0.62) / (by1 - by0)), 1, 2.6);
  zc = [(bx0 + bx1) / 2, (by0 + by1) / 2];
}

function drawMap(t, layers) {
  // Camera: full US, zoom to the risk 7.0-9.0s, back out 20-22s.
  const zin = easeInOut(seg(t, 7.0, 9.0)), zout = easeInOut(seg(t, 20.2, 22.2));
  const z = zin * (1 - zout);
  const k = lerp(1, zk, z);
  const cx = lerp(mapCenter[0], zc[0], z), cy = lerp(mapCenter[1], zc[1], z);
  ctx.save();
  rr(MAP.x, MAP.y, MAP.w, MAP.h, 28); ctx.fillStyle = C.panel; ctx.fill();
  ctx.clip();
  ctx.translate(mapCenter[0], mapCenter[1]); ctx.scale(k, k); ctx.translate(-cx, -cy);
  // land
  ctx.beginPath(); path(nation); ctx.fillStyle = C.land; ctx.fill();
  // layers: [{features, alpha, colorOf}]
  for (const L of layers) {
    if (L.alpha <= 0) continue;
    for (const f of L.features) {
      const a = L.alpha * (L.featureAlpha ? L.featureAlpha(f) : 1);
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.beginPath(); path(f);
      ctx.fillStyle = L.fill(f); ctx.fill();
      ctx.lineWidth = 2.5 / k; ctx.strokeStyle = L.stroke(f); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  // state lines on top
  ctx.beginPath(); path(topojson.mesh(D.states, D.states.objects.states, (a, b) => a !== b)); ctx.lineWidth = 1.4 / k; ctx.strokeStyle = C.state; ctx.stroke();
  ctx.beginPath(); path(nation); ctx.lineWidth = 2 / k; ctx.strokeStyle = "rgba(200,215,240,0.35)"; ctx.stroke();
  ctx.restore();
  // City labels while zoomed in (fixed size, skipping any that would overlap).
  if (z > 0.05) {
    ctx.save();
    rr(MAP.x, MAP.y, MAP.w, MAP.h, 28); ctx.clip();
    ctx.globalAlpha *= clamp(z * 1.4);
    ctx.font = '600 26px "SC Inter"';
    const placed = [];
    for (const [name, lon, lat] of CITIES) {
      const p = projection([lon, lat]);
      if (!p) continue;
      const x = (p[0] - cx) * k + mapCenter[0], y = (p[1] - cy) * k + mapCenter[1];
      const w = ctx.measureText(name).width;
      const box = [x - 8, y - 30, x + w + 18, y + 10];
      if (box[0] < MAP.x + 10 || box[2] > MAP.x + MAP.w - 10 || box[1] < MAP.y + 10 || box[3] > MAP.y + MAP.h - 50) continue;
      if (placed.some((b) => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
      placed.push(box);
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.stroke();
      ctx.lineWidth = 6; ctx.strokeStyle = "rgba(3,6,13,0.85)"; ctx.lineJoin = "round"; ctx.strokeText(name, x + 12, y - 8);
      ctx.fillStyle = "#fff"; ctx.fillText(name, x + 12, y - 8);
    }
    ctx.restore();
  }
  // frame + source
  rr(MAP.x, MAP.y, MAP.w, MAP.h, 28); ctx.lineWidth = 2; ctx.strokeStyle = C.line; ctx.stroke();
  text("Source: NOAA Storm Prediction Center", MAP.x + MAP.w - 24, MAP.y + MAP.h - 22, { size: 22, weight: 500, color: C.ink3, align: "right" });
}

const CITIES = [
  ["Oklahoma City", -97.52, 35.47], ["Dallas", -96.8, 32.78], ["Amarillo", -101.83, 35.22], ["Lubbock", -101.86, 33.58], ["Tulsa", -95.99, 36.15],
  ["Wichita Falls", -98.49, 33.91], ["Little Rock", -92.29, 34.75], ["Wichita", -97.34, 37.69], ["Kansas City", -94.58, 39.1], ["San Antonio", -98.49, 29.42],
  ["Austin", -97.74, 30.27], ["Houston", -95.37, 29.76], ["Midland", -102.08, 31.99], ["Abilene", -99.73, 32.45], ["Shreveport", -93.75, 32.53],
  ["Memphis", -90.05, 35.15], ["St. Louis", -90.2, 38.63], ["Denver", -104.99, 39.74], ["Albuquerque", -106.65, 35.08], ["El Paso", -106.49, 31.76],
  ["Omaha", -95.94, 41.26], ["Nashville", -86.78, 36.16], ["Louisville", -85.76, 38.25], ["Cincinnati", -84.51, 39.1], ["Columbus", -83.0, 39.96],
  ["Pittsburgh", -79.99, 40.44], ["Washington", -77.04, 38.91], ["Chicago", -87.63, 41.88], ["Indianapolis", -86.16, 39.77], ["Jackson", -90.18, 32.3],
  ["New Orleans", -90.07, 29.95], ["Birmingham", -86.8, 33.52], ["Atlanta", -84.39, 33.75], ["Minneapolis", -93.27, 44.98], ["Detroit", -83.05, 42.33],
  ["Charlotte", -80.84, 35.23], ["Philadelphia", -75.17, 39.95], ["New York", -74.01, 40.71], ["Phoenix", -112.07, 33.45], ["Salt Lake City", -111.89, 40.76],
];

// ── scenes ───────────────────────────────────────────────────────────────
const catOrder = ["TSTM", "MRGL", "SLGT", "ENH", "MDT", "HIGH"];
const catLayer = (t, alpha) => ({
  features: D.cat.features, alpha,
  featureAlpha: (f) => easeOut(seg(t, 3.6 + catOrder.indexOf(f.properties.LABEL) * 0.8, 4.3 + catOrder.indexOf(f.properties.LABEL) * 0.8)) * 0.9,
  fill: (f) => f.properties.fill, stroke: (f) => f.properties.stroke,
});
const probLayer = (fc, alpha) => ({
  features: fc.features.filter((f) => /^0\./.test(f.properties.LABEL)), alpha: alpha * 0.9,
  fill: (f) => f.properties.fill, stroke: (f) => f.properties.stroke,
});
const HAZ = [
  { key: "torn", name: "Tornado", t0: 10.0 },
  { key: "wind", name: "Damaging wind", t0: 13.4 },
  { key: "hail", name: "Large hail", t0: 16.8 },
];
const maxProb = (fc) => Math.max(0, ...fc.features.map((f) => Number(f.properties.LABEL)).filter((n) => !Number.isNaN(n))) * 100;
const words = (key, p) => {
  if (!p) return "Not expected";
  if (key === "torn") return p >= 15 ? "Significant" : p >= 10 ? "Elevated" : p >= 5 ? "A few possible" : "Brief, isolated";
  return p >= 45 ? "Significant" : p >= 30 ? "Elevated" : p >= 15 ? "Scattered" : "Isolated";
};
HAZ.forEach((h) => (h.p = maxProb(D[h.key])));

function header(t) {
  // Intro (big, centred) eases into the header bar at 2.4-3.2s.
  const m = easeInOut(seg(t, 2.4, 3.2));
  const ls = lerp(200, 92, m), lx = lerp(W / 2 - ls / 2, 56, m), ly = lerp(620, 120, m);
  if (logo.complete) { ctx.save(); rr(lx, ly, ls, ls, ls * 0.22); ctx.clip(); ctx.drawImage(logo, lx, ly, ls, ls); ctx.restore(); }
  const a0 = easeOut(seg(t, 0.2, 0.8));
  ctx.save(); ctx.globalAlpha = a0;
  if (m < 0.5) {
    const a = 1 - m * 2;
    text("STORM CENTRAL", W / 2, 900, { size: 34, weight: 700, color: C.accent, align: "center", spacing: 6, alpha: a });
    text("Severe weather", W / 2, 1010, { size: 96, weight: 700, family: "SC Inter", align: "center", alpha: a });
    text("outlook", W / 2, 1112, { size: 96, weight: 700, family: "SC Inter", align: "center", alpha: a });
    text(D.outlook.date, W / 2, 1200, { size: 40, weight: 500, color: C.ink2, align: "center", alpha: a });
  } else {
    const a = (m - 0.5) * 2;
    text("Severe weather outlook", 172, 160, { size: 50, weight: 700, family: "SC Inter", alpha: a });
    text(D.outlook.date, 172, 208, { size: 32, weight: 500, color: C.ink2, alpha: a });
  }
  ctx.restore();
}

function introRadar(t) {
  // A radar sweep behind the intro.
  const a = 1 - easeInOut(seg(t, 2.2, 3.0));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const cx = W / 2, cy = 720, R = 470;
  for (const r of [150, 300, 450]) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.strokeStyle = "rgba(56,189,248,0.18)"; ctx.lineWidth = 3; ctx.stroke(); }
  const ang = t * 2.4 - Math.PI / 2;
  const g = ctx.createConicGradient(ang - 0.7, cx, cy);
  g.addColorStop(0, "rgba(56,189,248,0)"); g.addColorStop(0.7 / (2 * Math.PI), "rgba(56,189,248,0.32)"); g.addColorStop(0.7 / (2 * Math.PI) + 0.001, "rgba(56,189,248,0)"); g.addColorStop(1, "rgba(56,189,248,0)");
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R); ctx.strokeStyle = "rgba(138,216,255,0.8)"; ctx.lineWidth = 4; ctx.stroke();
  ctx.restore();
}

const PANEL = { x: 40, y: 1060, w: 1000, h: 400 };

function riskPanel(t) {
  const a = easeOut(seg(t, 6.6, 7.4)) * (1 - easeOut(seg(t, 9.6, 10.0)));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const y = PANEL.y + lerp(30, 0, easeOut(seg(t, 6.6, 7.4)));
  text("Today's highest risk", PANEL.x + 10, y + 50, { size: 34, weight: 500, color: C.ink2 });
  const riskName = D.outlook.risk ? `${D.outlook.risk.toUpperCase()} RISK` : "NO SEVERE RISK";
  text(riskName, PANEL.x + 10, y + 160, { size: D.outlook.risk ? 108 : 92, weight: 800, family: "SC Inter", color: RISK_COLORS[(D.outlook.risk ?? "").toUpperCase()] ?? C.ink, spacing: -1 });
  text(`Level ${D.outlook.level} of 5`, PANEL.x + 10, y + 228, { size: 44, weight: 600 });
  // 5-segment meter, filling up to the level.
  for (let i = 0; i < 5; i++) {
    const fill = easeOut(seg(t, 7.6 + i * 0.18, 7.9 + i * 0.18));
    const x = PANEL.x + 10 + i * 196;
    rr(x, y + 262, 180, 22, 11); ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fill();
    if (i < D.outlook.level) { ctx.save(); rr(x, y + 262, 180 * fill, 22, 11); ctx.fillStyle = Object.values(RISK_COLORS)[i]; ctx.fill(); ctx.restore(); }
  }
  if (D.outlook.region) text(D.outlook.region, PANEL.x + 10, y + 350, { size: 40, weight: 600, color: C.ink2 });
  ctx.restore();
}

function hazardPanel(t) {
  const a = easeOut(seg(t, 9.9, 10.5)) * (1 - easeOut(seg(t, 20.0, 20.5)));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  text("Chance within 25 miles of a point", PANEL.x + 10, PANEL.y + 44, { size: 30, weight: 500, color: C.ink3 });
  HAZ.forEach((h, i) => {
    const y = PANEL.y + 80 + i * 108;
    const on = seg(t, h.t0, h.t0 + 0.4) - seg(t, h.t0 + 3.4, h.t0 + 3.8) * (i < 2 ? 1 : 0);
    const show = easeOut(seg(t, h.t0 - 0.2, h.t0 + 0.4));
    rr(PANEL.x, y, PANEL.w, 96, 20);
    ctx.fillStyle = `rgba(91,156,246,${0.16 * clamp(on)})`; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = `rgba(91,156,246,${0.15 + 0.5 * clamp(on)})`; ctx.stroke();
    ctx.save(); ctx.globalAlpha *= lerp(0.45, 1, clamp(on + (t > h.t0 + 3.4 ? 0.0 : 0)));
    text(h.name, PANEL.x + 30, y + 46, { size: 40, weight: 700 });
    text(words(h.key, h.p), PANEL.x + 30, y + 80, { size: 28, weight: 500, color: C.ink2 });
    const shown = Math.round(h.p * easeOut(seg(t, h.t0, h.t0 + 1.0)));
    text(`${shown}%`, PANEL.x + PANEL.w - 30, y + 66, { size: 60, weight: 800, family: "SC Inter", align: "right", alpha: show });
    ctx.restore();
  });
  ctx.restore();
}

function summaryPanel(t) {
  const a = easeOut(seg(t, 20.3, 21.0)) * (1 - easeOut(seg(t, 26.6, 27.2)));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  text("What to expect", PANEL.x + 10, PANEL.y + 50, { size: 34, weight: 500, color: C.ink2 });
  let size = 46, lines;
  for (; size >= 34; size -= 2) { lines = wrap(D.outlook.summary, PANEL.w - 20, `600 ${size}px "SC Inter"`); if (lines.length * size * 1.3 <= PANEL.h - 80) break; }
  // Lines appear one after another.
  lines.forEach((l, i) => {
    const la = easeOut(seg(t, 20.8 + i * 0.35, 21.3 + i * 0.35));
    text(l, PANEL.x + 10, PANEL.y + 120 + i * size * 1.3 + (1 - la) * 16, { size, weight: 600, alpha: la });
  });
  ctx.restore();
}

function endCard(t) {
  const a = easeOut(seg(t, 27.0, 27.8));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a * 0.92; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  const s = 220, x = W / 2 - s / 2, y = 470 + (1 - a) * 30;
  if (logo.complete) { ctx.save(); rr(x, y, s, s, 48); ctx.clip(); ctx.drawImage(logo, x, y, s, s); ctx.restore(); }
  text("Get alerts before", W / 2, y + 340, { size: 76, weight: 700, family: "SC Inter", align: "center" });
  text("the storm arrives", W / 2, y + 426, { size: 76, weight: 700, family: "SC Inter", align: "center" });
  const b = easeOut(seg(t, 28.3, 29.0));
  ctx.save(); ctx.globalAlpha = a * b;
  rr(W / 2 - 380, y + 500, 760, 120, 24); ctx.fillStyle = C.accent; ctx.fill();
  text("stormcentralwx.com", W / 2, y + 578, { size: 54, weight: 700, color: "#06101f", align: "center" });
  ctx.restore();
  text("Free on Windows, Android and the web", W / 2, y + 700, { size: 36, weight: 500, color: C.ink2, align: "center", alpha: b });
  text("Follow for the outlook every morning", W / 2, y + 790, { size: 36, weight: 600, color: C.accent, align: "center", alpha: easeOut(seg(t, 29.4, 30.0)) });
  ctx.restore();
}

window.render = function (t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // soft background glow
  const g = ctx.createRadialGradient(W / 2, 600, 50, W / 2, 600, 1200);
  g.addColorStop(0, "#0b1a36"); g.addColorStop(1, C.bg);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  introRadar(t);
  // Map from 2.8s.
  const ma = easeOut(seg(t, 2.8, 3.6));
  if (ma > 0) {
    ctx.save(); ctx.globalAlpha = ma;
    // Categorical, swapped for each hazard's probabilities while it's highlighted.
    const hz = HAZ.map((h, i) => clamp(seg(t, h.t0, h.t0 + 0.5) - seg(t, h.t0 + 3.4, h.t0 + 3.9) * (i < 2 ? 1 : 0) - (i === 2 ? seg(t, 20.0, 20.5) : 0)));
    const catA = 1 - Math.max(...hz);
    drawMap(t, [catLayer(t, catA), ...HAZ.map((h, i) => probLayer(D[h.key], hz[i]))]);
    ctx.restore();
  }
  header(t);
  riskPanel(t); hazardPanel(t); summaryPanel(t);
  endCard(t);
};
window.DUR = DUR;
</script>
</body>
</html>
