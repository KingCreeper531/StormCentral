<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1640 624" width="1640" height="624">
  <!--
    Storm Central's November cover for the Facebook Page: 1640x624 (twice Facebook's 820x312). The Page's
    profile picture covers the lower left (about x 0-690, y 250 down) on phones
    and computers alike, so the words and the art sit to the right of it.
  -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#4a2410"/>
      <stop offset="0.6" stop-color="#26110a"/>
      <stop offset="1" stop-color="#120704"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="1" stop-color="#fdd835"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <g id="maple">
      <path d="M0 -30 L6 -16 L14 -21 L12 -6 L27 -11 L21 0 L29 6 L14 9 L17 19 L4 13 L1 26 L-1 26 L-4 13 L-17 19 L-14 9 L-29 6 L-21 0 L-27 -11 L-12 -6 L-14 -21 L-6 -16 Z" stroke-linejoin="round"/>
      <path d="M0 26 L0 38 M0 18 L0 -18 M0 4 L14 -4 M0 4 L-14 -4" fill="none" stroke-opacity=".55"/>
    </g>
    <radialGradient id="cover-sky" cx="78%" cy="45%" r="75%">
      <stop offset="0" stop-color="#4a2410"/>
      <stop offset="0.55" stop-color="#26110a"/>
      <stop offset="1" stop-color="#120704"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
  </defs>
  <rect width="1640" height="624" fill="url(#cover-sky)"/>
  <circle cx="1430" cy="312" r="168" fill="url(#halo)"/>
  <path d="M1430 312 L1615 312 A185 185 0 0 1 1561 443 Z" fill="#ffb347" opacity=".16"/>
  <circle cx="1430" cy="312" r="185" fill="none" stroke="#ffb347" stroke-opacity=".55" stroke-width="2.8"/>
  <circle cx="1430" cy="312" r="148" fill="none" stroke="#ffb347" stroke-opacity=".32" stroke-width="2.2"/>
  <circle cx="1430" cy="312" r="112" fill="none" stroke="#ffb347" stroke-opacity=".2" stroke-width="1.7"/>
  <path d="M35 14 L26 34 h7 l-4 16 L41 28 h-7 z" transform="translate(1279.9 168.6) scale(4.48)" fill="#ffd54f" opacity=".55" filter="url(#soft)"/>
  <path d="M35 14 L26 34 h7 l-4 16 L41 28 h-7 z" transform="translate(1279.9 168.6) scale(4.48)" fill="url(#bolt)" stroke="#a8650a" stroke-width="0.6" stroke-linejoin="round"/>
  <g stroke-width="2.5">
    <use href="#maple" xlink:href="#maple" transform="translate(1576 190) rotate(22) scale(1.10)" fill="#f59a23" stroke="#8c5a12"/>
    <use href="#maple" xlink:href="#maple" transform="translate(1607 316) rotate(116) scale(1.06)" fill="#f2c43b" stroke="#8c6a12"/>
    <use href="#maple" xlink:href="#maple" transform="translate(1551 423) rotate(150) scale(1.01)" fill="#8aa83a" stroke="#45561a"/>
    <use href="#maple" xlink:href="#maple" transform="translate(1446 462) rotate(185) scale(0.97)" fill="#c8402a" stroke="#6e1d10"/>
    <use href="#maple" xlink:href="#maple" transform="translate(1351 425) rotate(219) scale(0.93)" fill="#e2672c" stroke="#8c3a12"/>
    <use href="#maple" xlink:href="#maple" transform="translate(1309 342) rotate(253) scale(0.88)" fill="#f59a23" stroke="#8c5a12"/>
    <use href="#maple" xlink:href="#maple" transform="translate(1331 261) rotate(288) scale(0.84)" fill="#f2c43b" stroke="#8c6a12"/>
    <use href="#maple" xlink:href="#maple" transform="translate(1394 221) rotate(322) scale(0.79)" fill="#8aa83a" stroke="#45561a"/>
    <use href="#maple" xlink:href="#maple" transform="translate(1459 232) rotate(356) scale(0.75)" fill="#c8402a" stroke="#6e1d10"/>
    <use href="#maple" xlink:href="#maple" transform="translate(130 110) rotate(-30) scale(1.5)" fill="#e2672c" stroke="#8c3a12"/>
    <use href="#maple" xlink:href="#maple" transform="translate(460 70) rotate(25) scale(1.0)" fill="#f2c43b" stroke="#8c6a12"/>
    <use href="#maple" xlink:href="#maple" transform="translate(330 200) rotate(-55) scale(1.1)" fill="#c8402a" stroke="#6e1d10"/>
    <use href="#maple" xlink:href="#maple" transform="translate(960 560) rotate(40) scale(1.1)" fill="#f59a23" stroke="#8c5a12"/>
    <use href="#maple" xlink:href="#maple" transform="translate(900 90) rotate(60) scale(0.9)" fill="#8aa83a" stroke="#45561a"/>
    <use href="#maple" xlink:href="#maple" transform="translate(1600 575) rotate(-20) scale(1.2)" fill="#c8402a" stroke="#6e1d10"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="720" y="250" font-size="88" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Hello,</text>
    <text x="720" y="345" font-size="88" font-weight="800" fill="url(#title)" letter-spacing="-1.5">November</text>
    <text x="724" y="403" font-size="34" font-weight="600" fill="#ffb347">Fall weather is here.</text>
    <text x="724" y="451" font-size="24" font-weight="500" fill="#e9c9a3" fill-opacity=".85">Live radar and alerts, free: stormcentralwx.com</text>
  </g>
</svg>
