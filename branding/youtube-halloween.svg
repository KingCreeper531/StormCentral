<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="sky" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#3a1d57"/>
      <stop offset="0.6" stop-color="#1c0f2b"/>
      <stop offset="1" stop-color="#0a0510"/>
    </radialGradient>
    <radialGradient id="pumpkin" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffa23c"/>
      <stop offset="0.65" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#c94f05"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffb81f"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <mask id="crescent"><rect width="800" height="800" fill="#fff"/><circle cx="638" cy="156" r="54" fill="#000"/></mask>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disk"><circle cx="400" cy="430" r="330"/></clipPath>
  </defs>
  <rect width="800" height="800" fill="url(#sky)"/>

  <!-- moon and bats -->
  <circle cx="610" cy="175" r="70" fill="#fff4d6" opacity=".12" filter="url(#blur)"/>
  <circle cx="610" cy="175" r="58" fill="#fff4d6" mask="url(#crescent)"/>
  <g fill="#07030c" stroke="#7d5aa0" stroke-width="1.5">
    <path transform="translate(590 205) scale(0.75) rotate(8)" d="M0 0 C-10 -12 -22 -14 -30 -8 C-38 -20 -52 -22 -60 -14 C-52 -12 -48 -6 -48 2 C-40 -4 -30 -2 -26 6 C-18 0 -8 2 0 10 C8 2 18 0 26 6 C30 -2 40 -4 48 2 C48 -6 52 -12 60 -14 C52 -22 38 -20 30 -8 C22 -14 10 -12 0 0 Z"/>
    <path transform="translate(205 175) scale(1.15)" d="M0 0 C-10 -12 -22 -14 -30 -8 C-38 -20 -52 -22 -60 -14 C-52 -12 -48 -6 -48 2 C-40 -4 -30 -2 -26 6 C-18 0 -8 2 0 10 C8 2 18 0 26 6 C30 -2 40 -4 48 2 C48 -6 52 -12 60 -14 C52 -22 38 -20 30 -8 C22 -14 10 -12 0 0 Z"/>
    <path transform="translate(300 120) scale(0.7) rotate(-10)" d="M0 0 C-10 -12 -22 -14 -30 -8 C-38 -20 -52 -22 -60 -14 C-52 -12 -48 -6 -48 2 C-40 -4 -30 -2 -26 6 C-18 0 -8 2 0 10 C8 2 18 0 26 6 C30 -2 40 -4 48 2 C48 -6 52 -12 60 -14 C52 -22 38 -20 30 -8 C22 -14 10 -12 0 0 Z"/>
  </g>

  <!-- radar rings and sweep -->
  <g fill="none" stroke="#ff7a1a">
    <circle cx="400" cy="430" r="330" stroke-opacity=".45" stroke-width="5"/>
    <circle cx="400" cy="430" r="265" stroke-opacity=".25" stroke-width="4"/>
  </g>
  <path d="M400 430 L730 430 A330 330 0 0 1 633 663 Z" fill="#ff7a1a" opacity=".22" clip-path="url(#disk)"/>

  <!-- pumpkin -->
  <ellipse cx="400" cy="440" rx="330" ry="250" fill="url(#halo)"/>
  <path d="M392 282 C388 250 398 228 420 212 L436 226 C420 240 414 258 418 284 Z" fill="#4f7a2a"/>
  <g fill="url(#pumpkin)" stroke="#a83f02" stroke-width="5">
    <ellipse cx="248" cy="440" rx="104" ry="138"/>
    <ellipse cx="552" cy="440" rx="104" ry="138"/>
    <ellipse cx="322" cy="436" rx="118" ry="152"/>
    <ellipse cx="478" cy="436" rx="118" ry="152"/>
    <ellipse cx="400" cy="432" rx="112" ry="160"/>
  </g>

  <!-- carved face: the Storm Central bolt -->
  <g>
    <g filter="url(#blur)" fill="#ffcf40">
      <path d="M285 395 L360 395 L322 335 Z"/>
      <path d="M440 395 L515 395 L478 335 Z"/>
      <path transform="translate(400 470) scale(4.4) translate(-33.5 -32)" d="M35 14 L26 34 h7 l-4 16 L41 28 h-7 z"/>
    </g>
    <g fill="url(#glow)" stroke="#7a2d00" stroke-width="3" stroke-linejoin="round">
      <path d="M285 395 L360 395 L322 335 Z"/>
      <path d="M440 395 L515 395 L478 335 Z"/>
      <path transform="translate(400 470) scale(4.4) translate(-33.5 -32)" stroke-width=".7" d="M35 14 L26 34 h7 l-4 16 L41 28 h-7 z"/>
    </g>
  </g>
</svg>
