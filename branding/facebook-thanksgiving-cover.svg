<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1640 624" width="1640" height="624">
  <!--
    Storm Central's Thanksgiving cover for the Facebook Page: 1640x624 (twice Facebook's 820x312). The Page's
    profile picture covers the lower left (about x 0-690, y 250 down) on phones
    and computers alike, so the words and the art sit to the right of it.
  -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#5a2a14"/>
      <stop offset="0.6" stop-color="#2e140a"/>
      <stop offset="1" stop-color="#140804"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="42%" cy="32%" r="75%">
      <stop offset="0" stop-color="#a8622f"/>
      <stop offset="0.7" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#55280e"/>
    </radialGradient>
    <radialGradient id="head" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b8743e"/>
      <stop offset="1" stop-color="#7f4219"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b3413"/>
      <stop offset="1" stop-color="#43200a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="1" stop-color="#fdd835"/>
    </linearGradient>
    <clipPath id="disk"><circle cx="400" cy="430" r="330"/></clipPath>
    <!-- One tail feather, pointing up from the turkey's middle (400, 470): fill from the use. -->
    <g id="feather">
      <ellipse cx="400" cy="318" rx="50" ry="152"/>
      <ellipse cx="400" cy="318" rx="50" ry="152" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="5"/>
      <path d="M400 172 V 455" stroke="#000" stroke-opacity=".22" stroke-width="4" fill="none"/>
      <ellipse cx="400" cy="196" rx="30" ry="22" fill="#fff" fill-opacity=".22"/>
    </g>
    <path id="leaf" d="M0 -26 C 14 -18 18 -2 0 26 C -18 -2 -14 -18 0 -26 Z M0 -22 V 30"/>
  
    <radialGradient id="cover-sky" cx="78%" cy="45%" r="75%">
      <stop offset="0" stop-color="#5a2a14"/>
      <stop offset="0.55" stop-color="#2e140a"/>
      <stop offset="1" stop-color="#140804"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
  </defs>

  <rect width="1640" height="624" fill="url(#cover-sky)"/>
  <circle cx="1455" cy="312" r="215" fill="url(#halo)"/>

  <!-- radar rings around the turkey -->
  <circle cx="1455" cy="312" r="172" fill="none" stroke="#ffb347" stroke-opacity=".45" stroke-width="3.5"/>
  <circle cx="1455" cy="312" r="134" fill="none" stroke="#ffb347" stroke-opacity=".25" stroke-width="2.5"/>
  <path d="M1455 312 L1627 312 A172 172 0 0 1 1577 434 Z" fill="#ffb347" opacity=".13"/>

  <!-- the turkey from the channel picture -->
  <g transform="translate(1455 318) scale(0.38) translate(-400 -430)">
  <!-- tail: the radar colour scale, red in the middle -->
  <use href="#feather" xlink:href="#feather" transform="rotate(-80 400 470)" fill="#2fa84f"/>
  <use href="#feather" xlink:href="#feather" transform="rotate(80 400 470)" fill="#2fa84f"/>
  <use href="#feather" xlink:href="#feather" transform="rotate(-60 400 470)" fill="#7cc63a"/>
  <use href="#feather" xlink:href="#feather" transform="rotate(60 400 470)" fill="#7cc63a"/>
  <use href="#feather" xlink:href="#feather" transform="rotate(-40 400 470)" fill="#f2d33b"/>
  <use href="#feather" xlink:href="#feather" transform="rotate(40 400 470)" fill="#f2d33b"/>
  <use href="#feather" xlink:href="#feather" transform="rotate(-20 400 470)" fill="#f59a23"/>
  <use href="#feather" xlink:href="#feather" transform="rotate(20 400 470)" fill="#f59a23"/>
  <use href="#feather" xlink:href="#feather" fill="#e2412c"/>

  <!-- feet -->
  <g stroke="#e8902a" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M370 610 V 650 M370 650 l-18 12 M370 650 l0 16 M370 650 l18 12"/>
    <path d="M430 610 V 650 M430 650 l-18 12 M430 650 l0 16 M430 650 l18 12"/>
  </g>

  <!-- body, wings, neck and head -->
  <ellipse cx="400" cy="505" rx="128" ry="128" fill="url(#body)" stroke="#3a1a07" stroke-width="5"/>
  <path d="M300 458 C 270 505 272 585 332 612 C 316 562 318 505 342 468 C 330 452 312 450 300 458 Z" fill="url(#wing)" stroke="#3a1a07" stroke-width="4" stroke-linejoin="round"/>
  <path d="M500 458 C 530 505 528 585 468 612 C 484 562 482 505 458 468 C 470 452 488 450 500 458 Z" fill="url(#wing)" stroke="#3a1a07" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="400" cy="405" rx="58" ry="70" fill="url(#head)"/>
  <circle cx="400" cy="335" r="60" fill="url(#head)" stroke="#3a1a07" stroke-width="5"/>
  <g>
    <circle cx="378" cy="325" r="13" fill="#fff"/>
    <circle cx="422" cy="325" r="13" fill="#fff"/>
    <circle cx="381" cy="328" r="7" fill="#1a0c04"/>
    <circle cx="419" cy="328" r="7" fill="#1a0c04"/>
    <circle cx="383" cy="325" r="2.5" fill="#fff"/>
    <circle cx="421" cy="325" r="2.5" fill="#fff"/>
  </g>
  <path d="M386 345 L414 345 L400 372 Z" fill="#f5a623" stroke="#b86d0c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M407 360 C 424 366 426 392 414 404 C 404 396 402 376 407 360 Z" fill="#d93025" stroke="#8c1810" stroke-width="3"/>

  <!-- the Storm Central bolt on its chest -->
  <path d="M35 14 L26 34 h7 l-4 16 L41 28 h-7 z" transform="translate(262 386) scale(4.1)" fill="url(#bolt)" stroke="#a8650a" stroke-width="0.7" stroke-linejoin="round"/>

  </g>

  <!-- words -->
  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" text-anchor="start">
    <text x="720" y="250" font-size="80" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Happy</text>
    <text x="720" y="340" font-size="80" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Thanksgiving</text>
    <text x="724" y="408" font-size="34" font-weight="600" fill="#ffb347">from all of us at Storm Central</text>
    <text x="724" y="456" font-size="24" font-weight="500" fill="#e9c9a3" fill-opacity=".85">Safe travels! Live radar: stormcentralwx.com</text>
  </g>

  <!-- falling leaves -->
  <g stroke-width="3" stroke-linecap="round">
    <use href="#leaf" xlink:href="#leaf" transform="translate(120 90) rotate(-35) scale(1.6)" fill="#e2672c" stroke="#8c3a12"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(330 200) rotate(-60) scale(1.3)" fill="#c8402a" stroke="#6e1d10"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(560 70) rotate(20) scale(1.1)" fill="#f2b13b" stroke="#8c5a12"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(1000 560) rotate(55) scale(1.2)" fill="#d98b2b" stroke="#7a4a10"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(1460 95) rotate(40) scale(1.5)" fill="#f2b13b" stroke="#8c5a12"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(1560 480) rotate(70) scale(1.7)" fill="#e2672c" stroke="#8c3a12"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(1240 575) rotate(-25) scale(0.9)" fill="#c8402a" stroke="#6e1d10"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(900 95) rotate(-15) scale(0.9)" fill="#d98b2b" stroke="#7a4a10"/>
  </g>
</svg>
