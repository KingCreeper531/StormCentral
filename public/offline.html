<!doctype html>
<!--
  The Android app's page for when the hosted Storm Central doesn't load
  (no signal, or a VPN or private DNS that can't find the address):
  Capacitor's server.errorPath shows it from the app's own files, in place
  of the WebView's error page, whose dark text is invisible on the app's
  black background. It retries by itself and offers the backup server
  (Vercel, the same app). scripts/build-native.mjs writes the build's
  addresses into the two meta tags. Same look as the desktop app's page
  (desktop/main.mjs).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="sc-app" content="https://app.stormcentralwx.com" />
    <meta name="sc-backup" content="https://storm-central-pi.vercel.app" />
    <title>Storm Central</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #a8acb3;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #ececed;
      }
      p {
        margin: 0;
        max-width: 420px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 6px;
      }
      button {
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid #25282d;
        border-radius: 6px;
        background: #16181b;
        color: #ececed;
        font: inherit;
      }
      button:active {
        background: #1f2226;
      }
      button.primary {
        border-color: #3b6fc4;
        background: #1e3a66;
      }
      #status {
        min-height: 1.5em;
        font-size: 12px;
        color: #6b7079;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1 data-t="title">Can't reach Storm Central</h1>
      <p data-t="body">Check your internet connection. If you use a VPN or a private DNS, it may be blocking the address.</p>
      <div class="actions">
        <button id="retry" type="button" data-t="retry">Try again</button>
        <button id="backup" type="button" data-t="backup">Use the backup server</button>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script>
      (() => {
        const meta = (name) => document.querySelector(`meta[name="${name}"]`).content.replace(/\/$/, "");
        const APP = meta("sc-app");
        const BACKUP = meta("sc-backup");
        const es = /^es\b/i.test(navigator.language || "");
        const T = es
          ? {
              title: "No se puede conectar con Storm Central",
              body: "Revisa tu conexión a internet. Si usas una VPN o un DNS privado, puede que esté bloqueando la dirección.",
              retry: "Reintentar",
              backup: "Usar el servidor de respaldo",
              checking: "Comprobando…",
              still: "Todavía sin conexión. Se vuelve a intentar solo.",
              backupUp: "El servidor de respaldo responde.",
            }
          : {
              title: "Can't reach Storm Central",
              body: "Check your internet connection. If you use a VPN or a private DNS, it may be blocking the address.",
              retry: "Try again",
              backup: "Use the backup server",
              checking: "Checking…",
              still: "Still can't connect. Trying again by itself.",
              backupUp: "The backup server is answering.",
            };
        document.documentElement.lang = es ? "es" : "en";
        for (const el of document.querySelectorAll("[data-t]")) el.textContent = T[el.dataset.t];
        const status = document.getElementById("status");
        const backupButton = document.getElementById("backup");
        if (!BACKUP) backupButton.hidden = true;

        // Whether a server answers at all (an opaque reply is enough).
        const answers = (base) =>
          fetch(`${base}/api/health?t=${Date.now()}`, { mode: "no-cors", cache: "no-store", ...(AbortSignal.timeout && { signal: AbortSignal.timeout(8000) }) }).then(
            () => true,
            () => false,
          );
        let busy = false;
        const check = async (byHand) => {
          if (busy) return;
          busy = true;
          if (byHand) status.textContent = T.checking;
          if (await answers(APP)) return location.replace(APP);
          const backupUp = !!BACKUP && (await answers(BACKUP));
          backupButton.classList.toggle("primary", backupUp);
          status.textContent = backupUp ? T.backupUp : byHand ? T.still : "";
          busy = false;
        };
        document.getElementById("retry").addEventListener("click", () => check(true));
        backupButton.addEventListener("click", () => location.assign(BACKUP));
        // Back by itself once the connection returns.
        setInterval(() => document.visibilityState === "visible" && check(false), 15000);
        window.addEventListener("online", () => check(false));
        check(false);
      })();
    </script>
  </body>
</html>
