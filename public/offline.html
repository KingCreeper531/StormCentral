<!doctype html>
<!--
  The Android app's page for when the hosted Storm Central doesn't load
  (no signal, or a VPN or private DNS that can't find the address):
  Capacitor's server.errorPath shows it from the app's own files, in place
  of the WebView's error page, whose dark text is invisible on the app's
  black background. When the backup server (Vercel, the same app) answers
  and the main one doesn't, it opens the backup by itself; with neither,
  the phone is offline, so it explains and retries. scripts/build-native.mjs
  writes the build's addresses into the two meta tags. Same look as the
  desktop app's page (desktop/main.mjs).

  The website's service worker (public/sw.js) shows it too, with an sc-web
  tag, when the server answers a page with an error (Cloudflare's 52x while
  it's down). There it checks this address's own /api/health, reloads the
  page once it's back, and offers the backup with a button but doesn't open
  it by itself: the backup is another address, so places and settings saved
  on the device aren't there unless they're synced to an account.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="sc-app" content="https://app.stormcentralwx.com" />
    <meta name="sc-backup" content="https://storm-central-pi.vercel.app" />
    <title>Storm Central</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #a8acb3;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #ececed;
      }
      p {
        margin: 0;
        max-width: 420px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 6px;
      }
      button {
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid #25282d;
        border-radius: 6px;
        background: #16181b;
        color: #ececed;
        font: inherit;
      }
      button:active {
        background: #1f2226;
      }
      button.primary {
        border-color: #3b6fc4;
        background: #1e3a66;
      }
      /* Until the first check decides: most of the time it opens a server straight away. */
      .checking h1,
      .checking p:not(#status),
      .checking .actions {
        display: none;
      }
      #status {
        min-height: 1.5em;
        font-size: 12px;
        color: #6b7079;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1 data-t="title">Can't reach Storm Central</h1>
      <p data-t="body">Check your internet connection. If you use a VPN or a private DNS, it may be blocking the address.</p>
      <div class="actions">
        <button id="retry" type="button" data-t="retry">Try again</button>
        <button id="backup" type="button" data-t="backup">Use the backup server</button>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script>
      (() => {
        const meta = (name) => document.querySelector(`meta[name="${name}"]`).content.replace(/\/$/, "");
        const WEB = !!document.querySelector('meta[name="sc-web"]');
        const APP = meta("sc-app");
        // On the backup itself there's nothing to switch to.
        const BACKUP = WEB && location.origin === meta("sc-backup") ? "" : meta("sc-backup");
        document.body.classList.add("checking");
        const es = /^es\b/i.test(navigator.language || "");
        const T = es
          ? {
              title: "No se puede conectar con Storm Central",
              body: "Revisa tu conexión a internet. Si usas una VPN o un DNS privado, puede que esté bloqueando la dirección.",
              retry: "Reintentar",
              backup: "Usar el servidor de respaldo",
              checking: "Comprobando…",
              connecting: "Conectando…",
              switching: "Conectando con el servidor de respaldo…",
              still: "Todavía sin conexión. Se vuelve a intentar solo.",
              backupUp: "El servidor de respaldo responde.",
              ...(WEB && {
                title: "El servidor de Storm Central no responde",
                body: "Suele volver en unos minutos y esta página se recarga sola. El servidor de respaldo tiene la misma app; lo guardado solo en este dispositivo (lugares, ajustes) no está allí salvo que inicies sesión para sincronizarlo.",
                backup: "Abrir el servidor de respaldo",
                still: "Todavía no responde. Se vuelve a intentar solo.",
              }),
            }
          : {
              title: "Can't reach Storm Central",
              body: "Check your internet connection. If you use a VPN or a private DNS, it may be blocking the address.",
              retry: "Try again",
              backup: "Use the backup server",
              checking: "Checking…",
              connecting: "Connecting…",
              switching: "Connecting to the backup server…",
              still: "Still can't connect. Trying again by itself.",
              backupUp: "The backup server is answering.",
              ...(WEB && {
                title: "Storm Central's server isn't answering",
                body: "It's usually back within a few minutes, and this page reloads by itself when it is. The backup server runs the same app; things saved only on this device (places, settings) aren't there unless you sign in to sync them.",
                backup: "Open the backup server",
                still: "Still not answering. Trying again by itself.",
              }),
            };
        document.documentElement.lang = es ? "es" : "en";
        for (const el of document.querySelectorAll("[data-t]")) el.textContent = T[el.dataset.t];
        const status = document.getElementById("status");
        const backupButton = document.getElementById("backup");
        if (!BACKUP) backupButton.hidden = true;

        const timeout = AbortSignal.timeout ? { signal: AbortSignal.timeout(8000) } : {};
        // Whether a server answers at all (an opaque reply is enough).
        const answers = (base) =>
          fetch(`${base}/api/health?t=${Date.now()}`, { mode: "no-cors", cache: "no-store", ...timeout }).then(
            () => true,
            () => false,
          );
        // On the website, Cloudflare answers even while the server is down, so only a real OK counts.
        const healthy = () =>
          fetch(`/api/health?t=${Date.now()}`, { cache: "no-store", ...timeout }).then(
            (r) => r.ok,
            () => false,
          );
        // A server that answers but whose page still fails (an HTTP error) brings the app back here: one opened
        // in the last 20 seconds is passed over, so the page can't bounce between it and this one.
        const store = (() => {
          try {
            return sessionStorage;
          } catch {
            return null;
          }
        })();
        const recent = (key) => Date.now() - Number(store?.getItem(key) || 0) < 20000;
        const open = (url, key) => {
          store?.setItem(key, String(Date.now()));
          location.replace(url);
        };

        // The same page on the backup (the address of the page that failed, on the backup's host).
        const onBackup = () => BACKUP + (WEB ? location.pathname + location.search + location.hash : "");

        let busy = false;
        const check = async (byHand) => {
          if (busy) return;
          busy = true;
          if (byHand) status.textContent = T.checking;
          if (WEB) {
            const [appUp, backupUp] = await Promise.all([healthy(), BACKUP ? answers(BACKUP) : false]);
            if (appUp) return location.reload();
            document.body.classList.remove("checking");
            backupButton.classList.toggle("primary", backupUp);
            status.textContent = byHand ? T.still : backupUp ? T.backupUp : "";
            busy = false;
            return;
          }
          const [appUp, backupUp] = await Promise.all([answers(APP), BACKUP ? answers(BACKUP) : false]);
          if (appUp && (byHand || !recent("sc-opened-app"))) return open(APP, "sc-opened-app");
          // The main server can't be reached from here but the backup can (often a VPN or a private DNS): use it.
          if (backupUp && !recent("sc-opened-backup")) {
            status.textContent = T.switching;
            return open(BACKUP, "sc-opened-backup");
          }
          document.body.classList.remove("checking");
          backupButton.classList.toggle("primary", backupUp);
          status.textContent = backupUp ? T.backupUp : byHand ? T.still : "";
          busy = false;
        };
        document.getElementById("retry").addEventListener("click", () => check(true));
        backupButton.addEventListener("click", () => open(onBackup(), "sc-opened-backup"));
        // Back by itself once the connection returns.
        setInterval(() => document.visibilityState === "visible" && check(false), 15000);
        window.addEventListener("online", () => check(false));
        status.textContent = T.connecting;
        check(false);
      })();
    </script>
  </body>
</html>
