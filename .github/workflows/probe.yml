# Temporary: fetches public placefiles' icon sheets (not reachable from the dev sandbox).
name: Probe (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in https://www.spotternetwork.org/feeds/gr-no.txt https://mesonet.agron.iastate.edu/request/grx/l3attr.txt https://mesonet.agron.iastate.edu/request/grx/time_mot_loc.txt; do
            echo "=================== $u"
            curl -s -m 30 -o /tmp/p "$u"
            grep -vE '^\s*(Object|Icon|End|Line|Polygon|Text|Place|Color|Threshold|[-0-9. ,]+$)' /tmp/p | head -15
            echo "-- keyword counts"; grep -oE '^\s*[A-Za-z]+:' /tmp/p | sort | uniq -c
            echo "-- icon file,number counts"; grep -E '^\s*Icon:' /tmp/p | awk -F, '{gsub(/ /,"",$4); gsub(/ /,"",$5); print "file " $4 " icon " $5}' | sort | uniq -c | sort -rn | head -25
            echo "-- rotations used"; grep -E '^\s*Icon:' /tmp/p | awk -F, '{gsub(/ /,"",$3); print $3}' | sort | uniq -c | sort -rn | head -8
            echo "-- hover shapes (letters masked)"; grep -E '^\s*Icon:' /tmp/p | head -12 | sed -E 's/"([^"\\]*)/"\1/' | sed -E 's/[A-Za-z]{3,}/W/g' | cut -c1-160
            echo "-- hover second lines"; grep -E '^\s*Icon:' /tmp/p | grep -oE '\\n[^"]*' | sed -E 's/\\n/ | /g' | sed -E 's/[0-9]{1,2}:[0-9]{2}(:[0-9]{2})?/HH:MM/g' | sort | uniq -c | sort -rn | head -12
            echo "-- text lines sample"; grep -E '^\s*Text:' /tmp/p | head -5 | cut -c1-120
            for s in $(grep -iE '^\s*IconFile:' /tmp/p | grep -oE 'https?://[^" ]+'); do
              echo "##### sheet $s"; curl -s -m 30 -o /tmp/s.png "$s"; file /tmp/s.png; ls -l /tmp/s.png | awk '{print $5 " bytes"}'
              echo "BEGIN64"; base64 -w 120 /tmp/s.png; echo "END64"
            done
          done
