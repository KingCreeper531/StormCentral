# Temporary: checks Open-Meteo's model names and ensemble format (not reachable from the dev sandbox).
name: Probe (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://ensemble-api.open-meteo.com/v1/ensemble?latitude=35.2&longitude=-97.4&models=ncep_gefs025&hourly=precipitation&past_hours=12&forecast_days=15&timeformat=unixtime&timezone=GMT&wind_speed_unit=ms" "https://api.open-meteo.com/v1/forecast?latitude=35.2&longitude=-97.4&models=ecmwf_ifs025,ncep_hrrr_conus&hourly=temperature_2m,cape&past_hours=12&forecast_days=10&timeformat=unixtime&timezone=GMT&wind_speed_unit=ms"; do
            echo "== $u"; curl -s -m 60 -o /tmp/b -w "%{http_code} %{size_download}B\n" "$u"
            python3 -c "import json,time; d=json.load(open('/tmp/b')); h=d.get('hourly',{}); t=h.get('time',[]); print('reason', d.get('reason')); print('hours', len(t), 'first', (t[0]-time.time())/3600 if t else None, 'h from now; keys', len(h))"
          done
