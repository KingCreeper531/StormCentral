# Temporary: checks the live hosting and the map sources for 3D terrain (not reachable from the dev sandbox).
name: Probe (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          pip install -q mapbox-vector-tile >/dev/null 2>&1
          python3 - <<'PY'
          import gzip, json, math, urllib.request, collections, mapbox_vector_tile
          tj = json.load(urllib.request.urlopen("https://tiles.basemaps.cartocdn.com/vector/carto.streets/v1/tiles.json", timeout=30))
          print("carto tilejson", tj.get("minzoom"), tj.get("maxzoom"), tj["tiles"][:1], [v["id"] for v in tj.get("vector_layers", [])])
          def tile(lat, lon, z):
              n = 2 ** z; x = int((lon + 180) / 360 * n); r = math.radians(lat)
              return x, int((1 - math.asinh(math.tan(r)) / math.pi) / 2 * n)
          for z in range(3, 11):
              x, y = tile(35.2, -97.4, z)
              url = tj["tiles"][0].replace("{z}", str(z)).replace("{x}", str(x)).replace("{y}", str(y))
              raw = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read()
              raw = gzip.decompress(raw) if raw[:2] == b'\x1f\x8b' else raw
              t = mapbox_vector_tile.decode(raw)
              b = collections.Counter((f["properties"].get("admin_level"), f["properties"].get("maritime")) for f in t.get("boundary", {}).get("features", []))
              tr = collections.Counter(f["properties"].get("class") for f in t.get("transportation", {}).get("features", []))
              pl = collections.Counter(f["properties"].get("class") for f in t.get("place", {}).get("features", []))
              print(f"z{z}: layers {sorted(t)}\n   boundary {dict(b)}\n   roads {dict(tr)}\n   places {dict(pl)}")
          PY
