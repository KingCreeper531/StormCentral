# Temporary: checks the archive and real-time radar sources (not reachable from the dev sandbox).
name: Probe (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://mesonet.agron.iastate.edu/geojson/sbw.geojson?ts=2013-05-20T20:00Z" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); fs=d['features']; print(len(fs), 'features')
          import collections; print(collections.Counter(f['properties']['phenomena']+'.'+f['properties']['significance'] for f in fs))
          for f in fs:
            p=f['properties']
            if p['phenomena'] in ('TO','SV'): print(json.dumps(p)[:1500]); print(f['geometry']['type'], str(f['geometry']['coordinates'])[:120]); break
          "
          echo; curl -s "https://mesonet.agron.iastate.edu/geojson/sbw.geojson?ts=2021-12-11T03:30Z" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); fs=d['features']
          for f in fs:
            p=f['properties']
            if p['phenomena']=='TO': print(json.dumps(p)[:1500]); break
          "
          echo; curl -s -D - -o /dev/null "https://mesonet.agron.iastate.edu/geojson/sbw.geojson?ts=2013-05-20T20:00Z" | grep -iE "cache-control|content-length"
