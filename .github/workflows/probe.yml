# Temporary: describes public placefiles' icon sheets (not reachable from the dev sandbox).
name: Probe (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q pillow
      - run: |
          set +e
          cat > /tmp/cells.py <<'PY'
          import sys
          from collections import Counter
          from PIL import Image
          path, w, h, wanted = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          im = Image.open(path).convert("RGBA")
          print("sheet", im.size, "cell", w, h)
          cols = im.size[0] // w
          rows = im.size[1] // h
          cells = range(1, cols * rows + 1) if wanted == "all" else [int(x) for x in wanted.split(",")]
          for n in cells:
              x0, y0 = ((n - 1) % cols) * w, ((n - 1) // cols) * h
              px = [im.getpixel((x0 + x, y0 + y)) for y in range(h) for x in range(w)]
              solid = [p for p in px if p[3] > 40]
              if not solid:
                  print(f"--- cell {n}: empty"); continue
              q = lambda p: (p[0] // 32 * 32, p[1] // 32 * 32, p[2] // 32 * 32)
              top = Counter(q(p) for p in solid).most_common(5)
              letters = {c: "abcde"[i] for i, (c, _) in enumerate(top)}
              print(f"--- cell {n}: {len(solid)} solid px; colours " + ", ".join(f"{letters[c]}=#{c[0]:02x}{c[1]:02x}{c[2]:02x}x{k}" for c, k in top))
              for y in range(h):
                  print("   " + "".join("." if px[y * w + x][3] <= 40 else letters.get(q(px[y * w + x]), "+") for x in range(w)))
          PY
          curl -s -m 30 -o /tmp/p https://www.spotternetwork.org/feeds/gr-no.txt
          grep -iE '^\s*IconFile:' /tmp/p
          curl -s -m 30 -o /tmp/q https://mesonet.agron.iastate.edu/request/grx/l3attr.txt
          grep -iE '^\s*IconFile:' /tmp/q
          get() { curl -sL -m 30 -o "$2" "$1"; file "$2"; }
          echo "##### spotternet_new (file 6)"; get https://www.spotternetwork.org/icon/spotternet_new.png /tmp/s6.png; python3 /tmp/cells.py /tmp/s6.png 22 22 all
          echo "##### arrows (file 2)"; get https://www.spotternetwork.org/icon/arrows.png /tmp/s2.png
          W=$(grep -iE '^\s*IconFile:\s*2,' /tmp/p | awk -F, '{gsub(/ /,"",$2); print $2}'); H=$(grep -iE '^\s*IconFile:\s*2,' /tmp/p | awk -F, '{gsub(/ /,"",$3); print $3}')
          python3 /tmp/cells.py /tmp/s2.png ${W:-15} ${H:-25} 15
          echo "##### spotternet (file 1)"; get https://www.spotternetwork.org/icon/spotternet.png /tmp/s1.png; python3 -c "from PIL import Image; print(Image.open('/tmp/s1.png').size)"
          echo "##### IEM storm_attribute"; get https://mesonet.agron.iastate.edu/request/grx/storm_attribute.png /tmp/i1.png
          W=$(grep -iE '^\s*IconFile:\s*1,' /tmp/q | awk -F, '{gsub(/ /,"",$2); print $2}'); H=$(grep -iE '^\s*IconFile:\s*1,' /tmp/q | awk -F, '{gsub(/ /,"",$3); print $3}')
          python3 /tmp/cells.py /tmp/i1.png ${W:-32} ${H:-32} all
