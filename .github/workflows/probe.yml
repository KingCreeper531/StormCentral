# Temporary: checks the self-hosted addresses and public placefile feeds (not reachable from the dev sandbox).
name: Probe (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for h in stormcentralwx.com www.stormcentralwx.com app.stormcentralwx.com pro.stormcentralwx.com storm-central-pi.vercel.app forecastmaster.io www.forecastmaster.io; do
            echo "== $h  A: $(dig +short A $h | tr '\n' ' ')  CNAME: $(dig +short CNAME $h | tr '\n' ' ')  NS: $(dig +short NS ${h#www.} | tr '\n' ' ')"
          done
          for u in https://app.stormcentralwx.com/api/health https://storm-central-pi.vercel.app/api/health https://www.stormcentralwx.com/ https://stormcentralwx.com/ https://pro.stormcentralwx.com/index.json https://forecastmaster.io/ https://www.forecastmaster.io/; do
            echo "== $u"; curl -s -m 20 -o /tmp/b -D - "$u" | grep -iE "^HTTP|^server:|^location:|^x-vercel|^content-type" | head -6; head -c 300 /tmp/b | tr '\n' ' '; echo
            grep -o '<title>[^<]*</title>' /tmp/b | head -1
          done
          grep -oE 'href="https://[^"]*(vercel|stormcentralwx)[^"]*"' <(curl -s -m 20 https://www.stormcentralwx.com/) | sort -u | head
          echo "== forecastmaster.io page text"; curl -sL -m 20 https://forecastmaster.io/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | head -c 1500; echo
          for u in https://www.spotternetwork.org/feeds/gr.txt http://www.spotternetwork.org/feeds/gr.txt https://www.spotternetwork.org/feeds/gr-no.txt https://www.spotternetwork.org/grlevelx.txt https://mesonet.agron.iastate.edu/request/grx/ https://mesonet.agron.iastate.edu/request/grx/time_mot_loc.txt https://mesonet.agron.iastate.edu/request/grx/l3attr.txt; do
            echo "== $u"; curl -s -m 20 -o /tmp/p -w '%{http_code} %{content_type} %{size_download}B\n' -H "Origin: https://stormcentralwx.com" -D /tmp/h "$u"; grep -i "access-control-allow-origin" /tmp/h; head -c 600 /tmp/p; echo
          done
          echo "== IEM grx index links"; curl -s -m 20 https://mesonet.agron.iastate.edu/request/grx/ | grep -oE 'href="[^"]+"' | head -40
