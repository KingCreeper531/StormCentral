# Temporary: checks Open-Meteo's model names and ensemble format (not reachable from the dev sandbox).
name: Probe (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://ensemble-api.open-meteo.com/v1/ensemble?latitude=35.2&longitude=-97.4&models=ncep_gefs025&hourly=temperature_2m&forecast_days=1" "https://api.open-meteo.com/v1/forecast?latitude=35.2&longitude=-97.4&models=ecmwf_aifs025_single,ncep_aigfs025&hourly=temperature_2m,precipitation&forecast_days=2"; do
            echo "== $u"; curl -s -m 30 -D - -o /tmp/b -H "Origin: https://stormcentralwx.com" "$u" | grep -iE "^HTTP|access-control"; head -c 400 /tmp/b; echo
          done
