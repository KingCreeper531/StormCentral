# Storm Central's X bot (bot/README.md): every 5 minutes, posts new severe
# weather warnings to the Storm Central account. Scheduled runs happen only
# when the repository variable BOT_ENABLED is "true"; "Run workflow" always
# works and defaults to a dry run that prints the posts instead.
name: X weather bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the posts instead of posting them
        type: boolean
        default: true

concurrency:
  group: x-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # What was already posted, carried from run to run.
      - uses: actions/cache/restore@v4
        with:
          path: bot/.state
          key: x-bot-state-${{ github.run_id }}
          restore-keys: x-bot-state-
      - name: Build the bot
        run: npx --yes esbuild@0.28.2 bot/main.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/x-bot.mjs --log-level=warning
      - name: Post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BOT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          BOT_DAILY_LIMIT: ${{ vars.BOT_DAILY_LIMIT || '16' }}
          BOT_STATE: bot/.state/state.json
        run: node /tmp/x-bot.mjs
      - uses: actions/cache/save@v4
        if: always() && hashFiles('bot/.state/state.json') != ''
        with:
          path: bot/.state
          key: x-bot-state-${{ github.run_id }}
