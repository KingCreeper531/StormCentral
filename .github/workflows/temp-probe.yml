name: TEMP probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='StormCentralBot/1.0 (github.com/KingCreeper531/StormCentral)'
          echo "== NWS SWO list"; curl -s -H "User-Agent: $UA" https://api.weather.gov/products/types/SWO/locations | head -c 1500; echo
          curl -s -H "User-Agent: $UA" https://api.weather.gov/products/types/SWO/locations/DY1 | head -c 1500; echo
          ID=$(curl -s -H "User-Agent: $UA" https://api.weather.gov/products/types/SWO/locations/DY1 | jq -r '."@graph"[0].id')
          echo "== product $ID"; curl -s -H "User-Agent: $UA" https://api.weather.gov/products/$ID | jq -r '.issuanceTime, .productText' | head -80
          echo "== SPC page images"; curl -s https://www.spc.noaa.gov/products/outlook/day1otlk.html | grep -oE '[A-Za-z0-9_./-]+\.(png|gif)' | sort -u | head -40
          for f in day1otlk_1300.png day1otlk.png day1otlk_0600.png day1otlk_1630.png day1otlk_2000.png day1otlk_0100.png; do echo "== $f"; curl -sI https://www.spc.noaa.gov/products/outlook/$f | grep -iE '^(HTTP|content-type|content-length|last-modified)'; done
          echo "== cat geojson"; curl -s https://www.spc.noaa.gov/products/outlook/day1otlk_cat.lyr.geojson | jq -c '[.features[].properties | {LABEL,LABEL2,VALID,EXPIRE,ISSUE}]' | head -c 1500
