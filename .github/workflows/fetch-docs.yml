# Temporary: prints YouTube's live chat streamList docs and proto (the docs host isn't reachable from the dev sandbox).
name: Fetch docs (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/fetch-docs.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q html2text
          for u in https://developers.google.com/youtube/v3/live/docs/liveChatMessages/streamList https://developers.google.com/youtube/v3/live/streaming-live-chat https://developers.google.com/youtube/data/live/streaming-live-chat https://developers.google.com/youtube/v3/live/docs/liveChatMessages https://developers.google.com/youtube/v3/live/docs/liveChatMessages/insert; do
            echo "=================== $u"
            curl -sL "$u" | html2text --ignore-images --body-width=0 | sed -n '/^# /,$p' | head -400
          done
          echo "=================== protos linked"
          curl -sL https://developers.google.com/youtube/v3/live/streaming-live-chat https://developers.google.com/youtube/data/live/streaming-live-chat | grep -oE 'https?://[^"'"'"' ]+\.(proto|py)' | sort -u | while read -r p; do echo "--- $p"; curl -sL "$p" | head -300; done
