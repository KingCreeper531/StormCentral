# Temporary: checks GraphCast on Open-Meteo (removed after).
name: API probe
on:
  push:
    paths: [".github/workflows/diag.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          for q in "models=gfs_graphcast025&hourly=temperature_2m,precipitation,weather_code,cloud_cover&forecast_days=10" "models=gfs_graphcast025&hourly=temperature_2m&forecast_days=7" "models=gfs_graphcast025&hourly=temperature_2m&past_days=3&forecast_days=1"; do
            echo "== $q"; curl -s "https://api.open-meteo.com/v1/forecast?latitude=40.44&longitude=-80&timezone=auto&timeformat=unixtime&$q" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if d.get('error'): print('ERROR', d.get('reason')); sys.exit()
          t=d['hourly']['temperature_2m']; tm=d['hourly']['time']
          idx=[i for i,v in enumerate(t) if v is not None]
          print('non-null', len(idx), 'of', len(t), 'first', idx[:3], 'last', idx[-3:] if idx else None)
          "
          done
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=40.44&longitude=-80&models=gfs_graphcast025&hourly=temperature_2m&forecast_days=1" | head -c 600; echo
