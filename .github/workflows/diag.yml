# Temporary: samples NOAA ACIS climate queries (removed after).
name: API probe
on:
  push:
    paths: [".github/workflows/diag.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: acis
        run: |
          O="Origin: https://storm-central-pi.vercel.app"
          q() { echo; echo "===== $1"; echo "$2"; curl -s -m 40 -G -H "$O" -D /tmp/h -o /tmp/b -w "status=%{http_code} size=%{size_download} time=%{time_total}\n" --data-urlencode "params=$2" "https://data.rcc-acis.org/$1"; grep -i "access-control\|content-type" /tmp/h; head -c ${3:-2500} /tmp/b; echo; }
          q StnMeta '{"bbox":"-80.6,40.0,-79.4,40.9","elems":"maxt","meta":"name,sids,ll,valid_daterange","sdate":"1991-01-01","edate":"2020-12-31"}' 5000
          q StnMeta '{"bbox":"-80.6,40.0,-79.4,40.9","sids":"thr","meta":"name,sids,ll"}' 1500
          q StnData '{"sid":"PITthr","sdate":"2026-10-10","edate":"2026-10-16","elems":[{"name":"maxt","normal":"1"},{"name":"mint","normal":"1"},{"name":"pcpn","normal":"1"}],"meta":"name,sids,ll"}' 1500
          q StnData '{"sid":"PITthr","sdate":"por","edate":"por","elems":[{"name":"maxt","interval":"dly","duration":"dly","smry":{"reduce":"max","add":"date"},"smry_only":1,"groupby":["year","10-12","10-18"]}],"meta":"name,valid_daterange"}' 2500
          q StnData '{"sid":"PITthr","sdate":"por","edate":"por","elems":[{"name":"maxt","interval":"dly","duration":"dly","smry":{"reduce":"max","add":"date"},"smry_only":1,"groupby":"year"}]}' 1500
          q StnData '{"sid":"PITthr","sdate":"por","edate":"por","elems":[{"name":"maxt","interval":"dly","duration":"dly","smry":{"reduce":"max","add":"date"},"smry_only":1,"groupby":["year","01-01","12-31"]},{"name":"mint","interval":"dly","duration":"dly","smry":{"reduce":"min","add":"date"},"smry_only":1,"groupby":["year","01-01","12-31"]},{"name":"pcpn","interval":"dly","duration":"dly","smry":{"reduce":"max","add":"date"},"smry_only":1,"groupby":["year","01-01","12-31"]}]}' 3000
          wc -c /tmp/b
          python3 -c "import json;d=json.load(open('/tmp/b'));s=d.get('smry');print(type(s), len(s) if s else None); print([len(x) for x in s] if s else d)"
          q StnData '{"sid":"PITthr","sdate":"2026-01-01","edate":"2026-12-31","elems":[{"name":"maxt","normal":"1"},{"name":"mint","normal":"1"},{"name":"pcpn","normal":"1"}]}' 600
          wc -c /tmp/b
          q StnData '{"sid":"PITthr","sdate":"2026-10-01","edate":"2026-10-12","elems":[{"name":"pcpn"},{"name":"maxt"}]}' 800
          q StnMeta '{"bbox":"-118.7,33.6,-117.8,34.5","elems":"maxt","meta":"name,sids,ll,valid_daterange","sdate":"1991-01-01","edate":"2020-12-31"}' 3000
          q StnMeta '{"bbox":"-104.6,32.3,-103.4,33.2","elems":"maxt","meta":"name,sids,ll,valid_daterange","sdate":"1991-01-01","edate":"2020-12-31"}' 3000
