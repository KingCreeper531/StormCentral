# Typecheck, lint and tests on every pull request and on main.
name: Check
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "branding/**", "store-assets/**", "website/**"]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: for f in vps/*.sh stream/*.sh; do bash -n "$f"; done
