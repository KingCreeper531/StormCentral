# Builds the Windows installer and the Android APK, and publishes them as a
# GitHub release. Installed apps update from the latest release:
#   - Windows: electron-updater reads latest.yml and installs in the background.
#   - Android: the app checks the latest release and offers the new APK.
#
# Release:  bump "version" in package.json, commit, then push a matching tag
#           (git tag v0.2.0 && git push origin v0.2.0), or run this workflow
#           from the Actions tab with "publish" ticked.
# Verify:   any push that touches the packaging builds both apps without publishing.
name: Release apps

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - ".github/workflows/release.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "desktop/**"
      - "electron-builder.config.mjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-native.mjs"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in package.json
        type: boolean
        default: false
      store_package:
        description: Also build the Microsoft Store package (MSIX); untick to leave the Store on the current version
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # The hosted Storm Central both apps load, so every user shares one spotter
  # network: the self-hosted server, which fails over to Vercel by itself
  # (vps/failover.sh). A repository variable STORMCENTRAL_URL overrides it.
  STORMCENTRAL_URL: ${{ vars.STORMCENTRAL_URL || 'https://app.stormcentralwx.com' }}
  # The Pro data server built into the apps (pro-server/); its products stay hidden while it's empty.
  NEXT_PUBLIC_PRO_SERVER: ${{ vars.PRO_SERVER_URL }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Bump package.json first."
              exit 1
            fi
            publish=true
          elif [[ "$EVENT" == "workflow_dispatch" && "$PUBLISH_INPUT" == "true" ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Storm Central $version (publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: node scripts/build-native.mjs desktop
      - name: Smoke-test the bundled server
        # Registering an account loads the native libSQL module, so a packaging
        # mistake fails here instead of on users' machines.
        shell: bash
        run: |
          cd build/desktop/server
          export PORT=47613 HOSTNAME=127.0.0.1 NODE_ENV=production SESSION_COOKIE_SECURE=false
          export DATABASE_URL="file:$(cygpath -m "$RUNNER_TEMP")/smoke/stormcentral.db"
          node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:47613/api/auth/me > /dev/null && break; sleep 1; done
          curl -sf -H "Origin: http://127.0.0.1:47613" -H "Content-Type: application/json" \
            -d '{"username":"ci_smoke","email":"ci@example.test","password":"correct horse battery","displayName":"CI"}' \
            http://127.0.0.1:47613/api/auth/register || { cat "$RUNNER_TEMP/server.log"; exit 1; }
          echo
          curl -sf -o /dev/null http://127.0.0.1:47613/ || { cat "$RUNNER_TEMP/server.log"; exit 1; }
          kill "$server_pid" 2>/dev/null || true
      - name: Package
        run: npx electron-builder --config electron-builder.config.mjs --win --x64 --publish never
        env:
          # Code signing is optional: add a certificate (base64 .pfx) and its
          # password as secrets and electron-builder signs the installer.
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Microsoft Store package: built only when its identity is set (Partner Center → Product identity),
          # as repository variables or in electron-builder.config.mjs.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          # "Run workflow" with the Store package unticked skips it (the Store keeps its current version).
          SKIP_MSIX: ${{ github.event_name == 'workflow_dispatch' && !inputs.store_package && '1' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/desktop/StormCentral-Setup-*.exe
            dist/desktop/StormCentral-Setup-*.exe.blockmap
            dist/desktop/latest.yml
            dist/desktop/StormCentral-*-store.appx

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.key.outputs.signing }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: node scripts/build-native.mjs android
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 isn't set, so the APK is signed with the shared development key. See ARCHITECTURE.md → Releases."
            echo "signing=shared" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Name APK
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk "dist/android/StormCentral-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: dist/android/*.apk

  release:
    name: Publish release
    needs: [check, windows, android]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SIGNING: ${{ needs.android.outputs.signing }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          tag="v$VERSION"
          {
            echo "## Download"
            echo
            echo "| Device | File |"
            echo "|---|---|"
            echo "| Windows 10 or 11 (64-bit) | \`StormCentral-Setup-$VERSION.exe\`: run it to install. The app updates itself from new releases. |"
            echo "| Android 7.0 or newer | \`StormCentral-$VERSION.apk\`: open it on your phone and allow installs from your browser when asked. After that, the app updates itself. |"
            if ls assets/*-store.appx > /dev/null 2>&1; then
              echo "| Microsoft Store | \`StormCentral-$VERSION-store.appx\`: the package uploaded to Partner Center. It can't be installed directly; get Storm Central from the Store or use the installer above. |"
            fi
            echo
            if [ "$WINDOWS_SIGNED" != "true" ]; then
              echo "The Windows installer isn't code-signed yet, so Windows may say \"Windows protected your PC\". Choose **More info → Run anyway**."
            fi
            if [ "$SIGNING" = "shared" ]; then
              echo
              echo "This APK is signed with the project's shared development key."
            fi
            echo
          } > notes.md
          ls -la assets
          # Notes are only the download table: no auto-generated PR list or contributor names.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Storm Central $VERSION" --notes-file notes.md --latest
          fi
      # The Releases page keeps the newest release (the apps update from it)
      # and the one before, whose Store download link must keep working until
      # the Microsoft Store listing moves to the new version.
      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -vx "v$VERSION" | tail -n +2 | while read -r old; do
            if [ -n "$old" ]; then
              echo "Deleting release $old"
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done

  # The Microsoft Store needs an installer URL that doesn't redirect, which
  # GitHub release downloads always do. GitHub Pages serves the files directly:
  #   https://<owner>.github.io/<repo>/download/<version>/StormCentral-Setup-<version>.exe
  # One-time setup: Settings → Pages → Source: GitHub Actions. Files are
  # deployed as a Pages artifact, not committed, so git's 100 MB file limit
  # doesn't apply.
  store-download:
    name: Publish the Store download
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Collect the downloads of the releases on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/download
          items=""
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 10 --json tagName --jq '.[].tagName'); do
            v="${tag#v}"
            mkdir -p "site/download/$v"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "StormCentral-Setup-$v.exe" --pattern "StormCentral-$v.apk" --dir "site/download/$v" || true
            links=""
            [ -f "site/download/$v/StormCentral-Setup-$v.exe" ] && links="$links<a href=\"download/$v/StormCentral-Setup-$v.exe\">Windows installer</a>"
            [ -f "site/download/$v/StormCentral-$v.apk" ] && links="$links<a href=\"download/$v/StormCentral-$v.apk\">Android APK</a>"
            [ -n "$links" ] && items="$items<li><h2>Storm Central $v</h2><p>$links</p></li>"
          done
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Storm Central downloads</title>
          <style>
            :root { color-scheme: dark light; --bg:#000; --ink:#f4f5f7; --ink2:#a4abb8; --line:#262a31; --accent:#5b9cf6; }
            @media (prefers-color-scheme: light) { :root { --bg:#f4f5f7; --ink:#0e0f11; --ink2:#4b5260; --line:#d8dce3; --accent:#2563d4; } }
            body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
            main { max-width:40rem; margin:0 auto; padding:40px 16px; }
            h1 { font-size:1.6rem; margin:0 0 4px; } h2 { font-size:1rem; margin:0 0 8px; }
            p.lead { color:var(--ink2); margin:0 0 24px; } ul { list-style:none; padding:0; margin:0; }
            li { border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
            a { display:inline-block; margin:0 8px 8px 0; padding:8px 12px; border-radius:6px; border:1px solid var(--line); color:var(--ink); text-decoration:none; }
            a:hover { border-color:var(--accent); } footer { color:var(--ink2); font-size:.85rem; margin-top:24px; }
            footer a { border:0; padding:0; margin:0; color:var(--accent); }
          </style></head>
          <body><main>
          <h1>Storm Central downloads</h1>
          <p class="lead">Free, open-source weather for Windows and Android. The newest version is first.</p>
          <ul>$items</ul>
          <footer>Release notes and source: <a href="https://github.com/$GITHUB_REPOSITORY/releases">GitHub Releases</a>.</footer>
          </main></body></html>
          HTML
          touch site/.nojekyll
          find site -type f -exec ls -la {} \;
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
