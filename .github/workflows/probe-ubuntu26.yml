# Temporary: does the live stream's software install and start on Ubuntu 26.04? Removed after use.
name: Probe Ubuntu 26.04
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe-ubuntu26.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: The stream's packages (as vps/setup.sh installs them)
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl git jq gnupg xvfb ffmpeg pulseaudio pulseaudio-utils pipx unzip fonts-inter fonts-dejavu-core fonts-noto-color-emoji > /dev/null && echo "apt packages: ok"
      - name: Node 22 from NodeSource (as the installer does)
        run: |
          grep -n "nodesource\|nodejs" vps/setup.sh 2>/dev/null | head -5 || true
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash - > /dev/null && apt-get install -y -qq nodejs > /dev/null && node -v
      - name: Playwright's Chromium and its system libraries
        run: |
          mkdir -p /opt/rt && cd /opt/rt && npm install --no-audit --no-fund --silent playwright-core@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/opt/browsers ./node_modules/.bin/playwright-core install --with-deps chromium 2>&1 | tail -5
          cat > t.mjs <<'JS'
          import { chromium } from "playwright-core";
          const b = await chromium.launch({ args: ["--use-gl=angle", "--use-angle=swiftshader"] });
          const p = await b.newPage();
          await p.setContent("<canvas id=c></canvas>");
          console.log("chromium", b.version(), "webgl:", await p.evaluate(() => !!document.getElementById("c").getContext("webgl")));
          await b.close();
          JS
          PLAYWRIGHT_BROWSERS_PATH=/opt/browsers node t.mjs
      - name: edge-tts (the voice)
        run: |
          PIPX_HOME=/opt/pipx PIPX_BIN_DIR=/usr/local/bin pipx install edge-tts==7.3.1 > /dev/null && edge-tts --version || edge-tts --help | head -2
