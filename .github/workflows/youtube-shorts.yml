# The Storm Central YouTube Shorts (shorts/README.md): each kind renders a
# vertical video from live NOAA data and uploads it to the Storm Central
# channel, in English with a Spanish localization, into the kind's playlist.
#
#   outlook   every morning, once SPC's 13Z Day 1 outlook is out
#   weekly    Sunday mornings, the next eight days
#   tropical  late morning, one per named storm (none when the tropics are quiet)
#   recap     late evening, the day's storm reports (active days only)
#   fire      mid afternoon, the most significant active wildfire (when there is one)
#   lesson    Wednesdays, Radar School: a full-length (16:9) lesson on reading radar, not a Short
#
# Scheduled runs happen only when the repository variable SHORTS_ENABLED is
# "true" (and SHORTS_KINDS, when set, lists the kind). "Run workflow" renders
# the chosen kind from the latest data to download from the run, and uploads
# only when asked to.
#
# A local model in Ollama rewrites the narrator's script livelier, every line
# checked against the facts (shorts/script.ts). It's on unless the variable
# SHORTS_AI is "false" (or "AI narration" is unticked on a manual run); if
# Ollama fails, the plain script is read.
name: YouTube Shorts

# GitHub sometimes starts a scheduled run very late or drops it, so each kind
# has a backup run about 40 minutes later. Runs of a kind queue one after
# another, and the posted marker keeps the backup from posting twice.
on:
  schedule:
    # outlook: 13:12 UTC (9:12 AM EDT, 8:12 AM CDT); it then waits up to 50 minutes for the outlook. Backup 14:05.
    - cron: "12 13 * * *"
    - cron: "5 14 * * *"
    # weekly: Sundays 13:40 UTC. Backup 14:20.
    - cron: "40 13 * * 0"
    - cron: "20 14 * * 0"
    # tropical: 15:40 UTC, after NHC's 15Z (11 AM EDT) advisories. Backup 16:20.
    - cron: "40 15 * * *"
    - cron: "20 16 * * *"
    # fire: 20:30 UTC (4:30 PM EDT), after the day's NIFC updates. Backup 21:10.
    - cron: "30 20 * * *"
    - cron: "10 21 * * *"
    # lesson: Wednesdays 17:20 UTC (1:20 PM EDT). Backup 18:00.
    - cron: "20 17 * * 3"
    - cron: "0 18 * * 3"
    # recap: 03:15 UTC (11:15 PM EDT, 10:15 PM CDT). Backup 03:55.
    - cron: "15 3 * * *"
    - cron: "55 3 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: Which Short
        type: choice
        options: [outlook, recap, weekly, tropical, fire, lesson]
        default: outlook
      upload:
        description: Upload to YouTube (otherwise only render it, to download from this run)
        type: boolean
        default: false
      scheduled:
        description: Behave like a scheduled run (for an outside scheduler such as cron-job.org; uploads, skips quiet days, posts once a day)
        type: boolean
        default: false
      lesson:
        description: "Radar School only: which lesson (number or id); empty for this week's, or the newest"
        type: string
        default: ""
      ai:
        description: AI narration (Ollama rewrites the script livelier; the run also keeps a copy with the plain narration to compare)
        type: boolean
        default: true

concurrency:
  # One run of a kind at a time (the backup waits for the first, then sees its posted marker).
  group: youtube-shorts-${{ inputs.kind || ((github.event.schedule == '15 3 * * *' || github.event.schedule == '55 3 * * *') && 'recap') || ((github.event.schedule == '40 13 * * 0' || github.event.schedule == '20 14 * * 0') && 'weekly') || ((github.event.schedule == '40 15 * * *' || github.event.schedule == '20 16 * * *') && 'tropical') || ((github.event.schedule == '30 20 * * *' || github.event.schedule == '10 21 * * *') && 'fire') || ((github.event.schedule == '20 17 * * 3' || github.event.schedule == '0 18 * * 3') && 'lesson') || 'outlook' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  short:
    if: (github.event_name == 'workflow_dispatch' && !inputs.scheduled) || vars.SHORTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # A full-length Radar School lesson takes about half an hour to render.
    timeout-minutes: 150
    env:
      # Manual runs: the "AI narration" box. Scheduled runs (and outside schedulers): the SHORTS_AI variable, on by default.
      SHORTS_AI: ${{ (github.event_name == 'workflow_dispatch' && !inputs.scheduled) && (inputs.ai && 'true' || 'false') || vars.SHORTS_AI || 'true' }}
      SHORTS_AI_MODEL: ${{ vars.SHORTS_AI_MODEL || 'gemma3:12b' }}
      SHORTS_KIND: ${{ inputs.kind || ((github.event.schedule == '15 3 * * *' || github.event.schedule == '55 3 * * *') && 'recap') || ((github.event.schedule == '40 13 * * 0' || github.event.schedule == '20 14 * * 0') && 'weekly') || ((github.event.schedule == '40 15 * * *' || github.event.schedule == '20 16 * * *') && 'tropical') || ((github.event.schedule == '30 20 * * *' || github.event.schedule == '10 21 * * *') && 'fire') || ((github.event.schedule == '20 17 * * 3' || github.event.schedule == '0 18 * * 3') && 'lesson') || 'outlook' }}
    steps:
      # The Short's day, in Eastern time and running 4 hours behind (the day ends at 4 AM), so a
      # run GitHub starts hours late still counts for the day it was meant for: the fire backup
      # once started at 8:16 PM EDT, after midnight UTC, and posted that day's fire a second time.
      - id: today
        run: echo "date=$(TZ=America/New_York date -d '-4 hours' +%F)" >> "$GITHUB_OUTPUT"
      # Scheduled kinds can be switched off one by one with SHORTS_KINDS ("outlook,recap").
      - id: on
        env:
          KINDS: ${{ vars.SHORTS_KINDS }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.scheduled }}
        run: |
          if [ "$MANUAL" = true ] || [ -z "$KINDS" ] || echo ",${KINDS// /}," | grep -qi ",$SHORTS_KIND,"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "$SHORTS_KIND isn't in SHORTS_KINDS ($KINDS); skipping."
          fi
      # Each kind posts once a day: a marker in the Actions cache once it's up. ("-et": markers keyed
      # by the old UTC day, like the duplicate fire's, would otherwise block the next day's Short.)
      - id: posted
        if: steps.on.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: shorts/.posted
          key: shorts-posted-et-${{ env.SHORTS_KIND }}-${{ steps.today.outputs.date }}
          lookup-only: true
      - id: go
        if: steps.on.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && !inputs.scheduled) || steps.posted.outputs.cache-hit != 'true')
        run: echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.go.outputs.go == 'true'
      - uses: actions/setup-node@v5
        if: steps.go.outputs.go == 'true'
        with:
          node-version: 22
      - name: Install the renderer (Chromium, ffmpeg and the narrator's edge-tts)
        if: steps.go.outputs.go == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/shorts" --no-audit --no-fund playwright-core@1.56.1
          "$RUNNER_TEMP/shorts/node_modules/.bin/playwright-core" install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pipx install edge-tts==7.3.1 || echo "::warning::Couldn't install edge-tts; the Short will have no narration."
      # The AI narrator runs on the runner's CPU (4 cores, 16 GB): no GPU or API key. If this fails, the plain script is read.
      - name: Start the AI narrator (Ollama)
        # Radar School reads its hand-checked script as written, so it needs no model.
        if: steps.go.outputs.go == 'true' && env.SHORTS_AI == 'true' && env.SHORTS_KIND != 'lesson'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts Ollama as a systemd service; some runners have no systemd, so start it here if it isn't up.
          if ! curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
            nohup ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
            for _ in $(seq 30); do curl -sf http://127.0.0.1:11434/api/version >/dev/null && break; sleep 1; done
          fi
          ollama pull "$SHORTS_AI_MODEL"
      - name: Build
        if: steps.go.outputs.go == 'true'
        run: npx --yes esbuild@0.28.2 shorts/main.ts --bundle --platform=node --format=esm --target=node22 --external:playwright-core --outfile="$RUNNER_TEMP/shorts/shorts.mjs" --log-level=warning
      # Fire: yesterday's fire sizes, to tell how much each fire grew.
      - uses: actions/cache/restore@v4
        if: steps.go.outputs.go == 'true' && env.SHORTS_KIND == 'fire'
        with:
          path: shorts/.state
          key: shorts-fire-state-${{ github.run_id }}
          restore-keys: shorts-fire-state-
      - name: Make the Short
        id: make
        if: steps.go.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHORTS_UPLOAD: ${{ (github.event_name == 'schedule' || inputs.upload || inputs.scheduled) && '1' || '0' }}
          SHORTS_LATEST: ${{ (github.event_name == 'workflow_dispatch' && !inputs.scheduled) && '1' || '0' }}
          SHORTS_PRIVACY: ${{ vars.SHORTS_PRIVACY || 'public' }}
          SHORTS_SKIP_QUIET: ${{ vars.SHORTS_SKIP_QUIET || 'false' }}
          SHORTS_PLAYLISTS: ${{ vars.SHORTS_PLAYLISTS || 'true' }}
          SHORTS_VOICE: ${{ vars.SHORTS_VOICE || 'true' }}
          SHORTS_VOICE_NAME: ${{ vars.SHORTS_VOICE_NAME || 'en-US-AndrewNeural' }}
          SHORTS_TROPICAL_MAX: ${{ vars.SHORTS_TROPICAL_MAX || '2' }}
          SHORTS_FIRE_MAX: ${{ vars.SHORTS_FIRE_MAX || '1' }}
          SHORTS_LESSON: ${{ inputs.lesson }}
          SHORTS_AI_COMPARE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.scheduled && inputs.ai) && '1' || '0' }}
        run: node "$RUNNER_TEMP/shorts/shorts.mjs"
      - uses: actions/cache/save@v4
        if: always() && env.SHORTS_KIND == 'fire' && hashFiles('shorts/.state/fire-sizes.json') != ''
        with:
          path: shorts/.state
          key: shorts-fire-state-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('shorts/out/*.mp4') != ''
        with:
          name: ${{ env.SHORTS_KIND }}-short-${{ steps.today.outputs.date }}
          path: |
            shorts/out/*.mp4
            shorts/out/*.json
            shorts/out/*.jpg
          retention-days: 7
      - name: Mark today as posted
        # always(): a run where one of two videos failed still records the one it posted.
        if: always() && steps.make.outputs.uploaded == 'true'
        run: mkdir -p shorts/.posted && date -u > shorts/.posted/at
      - uses: actions/cache/save@v4
        # always(): a run where one of two videos failed still records the one it posted.
        if: always() && steps.make.outputs.uploaded == 'true'
        with:
          path: shorts/.posted
          key: shorts-posted-et-${{ env.SHORTS_KIND }}-${{ steps.today.outputs.date }}
