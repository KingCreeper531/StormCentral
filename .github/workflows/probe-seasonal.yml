name: TEMP probe seasonal
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe-seasonal.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CPC seasonal outlook sources
        run: |
          set +e
          M=https://mapservices.weather.noaa.gov/vector/rest/services/outlooks
          for svc in cpc_sea_temp_outlk cpc_sea_precip_outlk; do
            echo "=== $svc"
            curl -sS -m 30 "$M/$svc/MapServer?f=json" | jq -c '{layers: [.layers[]? | {id, name}], desc: .serviceDescription[0:300]}'
            for l in 0 1 2; do
              echo "--- layer $l"
              curl -sS -m 30 "$M/$svc/MapServer/$l?f=json" | jq -c '{name, type, fields: [.fields[]?.name], maxRecordCount}'
              curl -sS -m 60 "$M/$svc/MapServer/$l/query?where=1%3D1&outFields=*&returnGeometry=true&f=geojson" -o /tmp/q.json
              ls -la /tmp/q.json
              jq -c '{n: (.features|length), props: [.features[]?.properties], gtypes: [.features[]?.geometry.type], pts: [.features[]? | (.geometry.coordinates|flatten|length)]}' /tmp/q.json | cut -c1-2500
            done
          done
          echo "=== ftp listing"
          curl -sS -m 30 https://ftp.cpc.ncep.noaa.gov/GIS/us_tempprcpfcst/ | grep -o 'href="[^"]*"' | tail -30
          echo "=== seasonal page"
          curl -sS -m 30 "https://www.cpc.ncep.noaa.gov/products/predictions/long_range/seasonal.php?lead=2" | grep -oiE '(src|href)="[^"]*(gif|png|kml|zip|shp)[^"]*"' | head -30
          echo "=== PMD discussion head"
          curl -sS -m 30 https://www.cpc.ncep.noaa.gov/products/predictions/long_range/fxus05.html | sed 's/<[^>]*>//g' | grep -v '^\s*$' | head -60
