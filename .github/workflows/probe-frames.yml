# TEMP: commits the CPU probe's frames to this branch so they can be looked at. Removed after use.
name: Probe frames
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe-frames.yml]
permissions:
  contents: write
  actions: read
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: stream-cpu-probe
          run-id: 39689827567
          github-token: ${{ github.token }}
          path: probe-frames
      - run: |
          ls -la probe-frames
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-frames
          git commit -m "TEMP: the CPU probe's frames, to look at (removed before the PR)"
          git push
