name: TEMP Android compile check
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/android-check.yml, "android/**"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: node scripts/build-native.mjs android
      - name: Build APK (release, with lint)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Errors
        if: failure()
        working-directory: android
        run: |
          grep -n -B2 -A8 "error:\|What went wrong\|Errors found" build.log | head -120
          ls app/build/reports/lint-results* 2>/dev/null && grep -o '<issue[^>]*severity="\(Error\|Fatal\)"[^>]*' app/build/intermediates/lint_vital_intermediate_text_report/*/*.txt 2>/dev/null | head -20 || true
          find app/build -name "lint-results*.txt" -exec sed -n 1,60p {} \; 2>/dev/null | head -80 || true
