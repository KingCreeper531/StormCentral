name: Probe NEXRAD archive (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe-cams.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/trusting-pasteur-qzc0fq }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Decode famous storms
        run: |
          cat > probe.mts <<'TS'
          import { gunzipSync } from "node:zlib";
          import { parseLevel2 } from "./src/lib/pro/nexrad/level2";
          import { levelAt } from "./src/lib/pro/nexrad/sweep";
          const BUCKET = "https://noaa-nexrad-level2.s3.amazonaws.com";
          const cases = [
            { name: "Moore 2013", site: "KTLX", day: "2013/05/20", at: "20:10", lat: 35.33, lon: -97.48 },
            { name: "Mayfield 2021", site: "KPAH", day: "2021/12/11", at: "03:25", lat: 36.74, lon: -88.64 },
            { name: "Rolling Fork 2023", site: "KDGX", day: "2023/03/25", at: "01:05", lat: 32.91, lon: -90.88 },
            { name: "Iowa derecho 2020", site: "KDMX", day: "2020/08/10", at: "16:30", lat: 41.6, lon: -93.6 },
            { name: "Joplin 2011", site: "KSGF", day: "2011/05/22", at: "22:40", lat: 37.08, lon: -94.51 },
          ];
          for (const c of cases) {
            const t0 = Date.now();
            const xml = await (await fetch(`${BUCKET}/?list-type=2&max-keys=1000&prefix=${c.day}/${c.site}/`)).text();
            const keys = [...xml.matchAll(/<Key>([^<]+)<\/Key>/g)].map((m) => m[1]!).filter((k) => !k.endsWith("_MDM"));
            const target = Date.parse(`${c.day.replace(/\//g, "-")}T${c.at}:00Z`);
            const timeOf = (k: string) => { const m = k.match(/(\d{8})_(\d{6})/); return m ? Date.parse(`${m[1]!.slice(0,4)}-${m[1]!.slice(4,6)}-${m[1]!.slice(6,8)}T${m[2]!.slice(0,2)}:${m[2]!.slice(2,4)}:${m[2]!.slice(4,6)}Z`) : NaN; };
            const key = keys.filter((k) => timeOf(k) <= target).at(-1) ?? keys[0];
            console.log(`\n== ${c.name}: ${keys.length} files; using ${key}`);
            if (!key) continue;
            let buf = new Uint8Array(await (await fetch(`${BUCKET}/${key}`)).arrayBuffer());
            console.log("bytes", buf.length, "magic", String.fromCharCode(...buf.subarray(0, 8)));
            if (buf[0] === 0x1f && buf[1] === 0x8b) { buf = new Uint8Array(gunzipSync(buf)); console.log("gunzipped", buf.length, String.fromCharCode(...buf.subarray(0, 8))); }
            for (const m of ["REF", "VEL", "RHO"] as const) {
              try {
                const r = parseLevel2(buf, m, 0.5);
                const s = r.sweep;
                if (!s) { console.log(m, "no sweep; cuts", r.cuts.map((x) => x.angle).slice(0, 6)); continue; }
                const lvl = levelAt(s, c.lat, c.lon);
                let max = -Infinity, min = Infinity;
                for (let i = 0; i < s.data.length; i++) { const v = s.table[s.data[i]!]!; if (Number.isFinite(v)) { if (v > max) max = v; if (v < min) min = v; } }
                console.log(m, `elev ${s.elevation} radials ${s.nRadials} gates ${s.nGates} gate ${s.gateKm} km first ${s.firstGateKm}; at point ${s.table[lvl]} ; range ${min.toFixed(2)}..${max.toFixed(2)} ; site ${s.lat},${s.lon} ; ${new Date(s.time).toISOString()}`);
              } catch (e) { console.log(m, "ERR", (e as Error).message); }
            }
            console.log("ms", Date.now() - t0);
          }
          TS
          npx --yes tsx probe.mts
