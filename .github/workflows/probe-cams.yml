name: Probe webcam sources (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe-cams.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe
        run: |
          cat > p.mjs <<'JS'
          const UA = { "User-Agent": "StormCentral probe (github.com/KingCreeper531/StormCentral)" };
          async function hit(label, url, { json = false, show = 1200, init = {} } = {}) {
            try {
              const r = await fetch(url, { headers: UA, redirect: "follow", ...init, signal: AbortSignal.timeout(25000) });
              const h = (k) => r.headers.get(k);
              console.log(`\n=== ${label}\n${r.status} ${h("content-type")} len=${h("content-length")} acao=${h("access-control-allow-origin")} cache=${h("cache-control")} lastmod=${h("last-modified")} final=${r.url}`);
              const buf = Buffer.from(await r.arrayBuffer());
              console.log("bytes", buf.length);
              if (json) return JSON.parse(buf.toString());
              const t = buf.toString("utf8");
              if (show && !/image|octet/.test(h("content-type") || "")) console.log(t.slice(0, show));
              return t;
            } catch (e) { console.log(`\n=== ${label}\nERR ${e.message}`); return null; }
          }
          const grep = (t, re, n = 25) => { if (!t) return; const m = t.split(/\n/).filter((l) => re.test(l)).slice(0, n); console.log("--- grep", re, "\n" + m.map((l) => l.trim().slice(0, 300)).join("\n")); };

          const text = (html) => html?.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
          // ALERTCalifornia: coords, image variants, terms
          const ac = await hit("ALERTCA list", "https://cameras.alertcalifornia.org/public-camera-data/all_cameras-v3.json", { json: true });
          if (ac) { const f = ac.features; const num = f.filter((x) => Number.isFinite(x.geometry?.coordinates?.[0]) && Number.isFinite(x.geometry?.coordinates?.[1]));
            console.log("numeric coords", num.length); const st = {}; for (const x of num) st[x.properties.state || "?"] = (st[x.properties.state || "?"] || 0) + 1; console.log("by state", JSON.stringify(st));
            const now = Date.now() / 1000; console.log("fresh<1h", num.filter((x) => now - x.properties.last_frame_ts < 3600).length);
            console.log(JSON.stringify(num[0], null, 0).slice(0, 900)); const id = num[0].properties.id;
            for (const v of ["latest-thumb.jpg", "latest-frame-thumb.jpg", "thumb.jpg", "latest-frame-small.jpg", "latest-frame.jpg"]) await hit("ALERTCA " + v, `https://cameras.alertcalifornia.org/public-camera-data/${id}/${v}`, { show: 0 }); }
          const acHtml = await hit("ALERTCA site", "https://cameras.alertcalifornia.org/", { show: 0 });
          const js = [...(acHtml ?? "").matchAll(/src="([^"]+\.js)"/g)].map((m) => m[1]); console.log("js", js);
          for (const j of js.slice(0, 4)) { const u = new URL(j, "https://cameras.alertcalifornia.org/").href; const t = await hit("ALERTCA js " + u, u, { show: 0 }); const m = [...new Set((t ?? "").match(/[\w\/.-]*(latest|thumb|frame)[\w\/.-]*\.(jpg|jpeg|webp)/gi) ?? [])]; console.log("img names", m.slice(0, 30)); }
          for (const u of ["https://alertcalifornia.org/?p=1164", "https://alertcalifornia.org/?p=1501"]) { const t = await hit("ALERTCA " + u, u, { show: 0 }); const tx = text(t) ?? ""; const i = tx.search(/terms|credit|public use/i); console.log(tx.slice(Math.max(0, i - 200), i + 2500)); }

          // Caltrans conditions
          const cu = await hit("Caltrans conditions", "https://dot.ca.gov/conditions-of-use", { show: 0 }); const ct = text(cu) ?? ""; const ci = ct.search(/Conditions of Use/i); console.log(ct.slice(ci, ci + 4000));
          for (const d of ["01","02","05","06","08","09","10","11","12"]) { const r = await hit(`Caltrans D${d}`, `https://cwwp2.dot.ca.gov/data/d${+d}/cctv/cctvStatusD${d}.json`, { json: true }); if (r) { const l = r.data; console.log("count", l.length, "inService", l.filter((x) => x.cctv.inService === "true").length, "withImg", l.filter((x) => x.cctv.imageData?.static?.currentImageURL).length); } }

          // USGS NIMS
          const nims = await hit("NIMS cameras", "https://api.waterdata.usgs.gov/nims/v0/cameras", { json: true });
          if (nims) { const l = Array.isArray(nims) ? nims : nims.cameras ?? nims.items ?? nims.data ?? Object.values(nims)[0]; console.log("type", Array.isArray(nims) ? "array" : Object.keys(nims), "count", l?.length); console.log(JSON.stringify(l?.slice(0, 2), null, 1)?.slice(0, 3500));
            const c = l?.[0]; const id = c?.camId; if (id) { await hit("NIMS newest", `https://usgs-nims-images.s3.amazonaws.com/720/${id}/${id}_newest.jpg`, { show: 0 }); await hit("NIMS thumb?", `https://usgs-nims-images.s3.amazonaws.com/thumbs/${id}/${id}_newest.jpg`, { show: 0 }); } }
          const nd = await hit("NIMS docs md", "https://api.waterdata.usgs.gov/docs/nims/index.html.md", { show: 0 }); const ni = (nd ?? "").search(/rate limit|api key/i); console.log((nd ?? "").slice(Math.max(0, ni - 300), ni + 1800));
          const nimsSw = await hit("NIMS openapi", "https://api.waterdata.usgs.gov/nims/v0/openapi.json", { show: 0 }); grep(nimsSw, /lat|lon|newest|tz|state|camName|"[a-zA-Z]+Dir"/i, 60);

          // HPWREN
          const cc = await hit("HPWREN cc", "https://www.hpwren.ucsd.edu/cc.html", { show: 0 }); console.log((text(cc) ?? "").slice(0, 3500));
          const hpT = await hit("HPWREN cameras page", "https://www.hpwren.ucsd.edu/cameras/", { show: 0 });
          console.log("img urls", [...new Set((hpT ?? "").match(/[\w\/:.-]+\.jpg/gi) ?? [])].slice(0, 20));
          const hpJs = [...(hpT ?? "").matchAll(/src="([^"]+\.js)"/g)].map((m) => m[1]); console.log("hp js", hpJs);
          for (const j of hpJs.slice(0, 5)) { const u = new URL(j, "https://www.hpwren.ucsd.edu/cameras/").href; const t = await hit("HP js " + u, u, { show: 0 }); console.log("jpg patterns", [...new Set((t ?? "").match(/[^"'`\s]*(\.jpg|latest|\/L\/|\/c\/)[^"'`\s]*/gi) ?? [])].slice(0, 25)); }
          for (const u of ["https://www.hpwren.ucsd.edu/cameras/L/bh-n-mobo-c.jpg", "https://hpwren.ucsd.edu/cameras/L/bh-n-mobo-c.jpg", "https://www.hpwren.ucsd.edu/cameras/latest/bh-n-mobo-c.jpg"]) await hit("HP img " + u, u, { show: 0 });
          JS
          node p.mjs
