# Temporary: runs the state DOT camera parsers against the live layers. Removed after use.
name: Probe camera sources
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [".github/workflows/probe-cams.yml", "src/lib/feeds/webcams.live.test.ts"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/feeds/webcams.live.test.ts
        env:
          LIVE_CAMS: "1"
