# Temporary: checks camera sources and their terms from a runner. Removed after use.
name: Probe camera sources
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [".github/workflows/probe-cams.yml", ".github/probe-cams.mjs"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node .github/probe-cams.mjs
