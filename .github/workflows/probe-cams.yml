name: Probe webcam feed (temporary)
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe-cams.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/trusting-pasteur-qzc0fq }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run the feed
        run: |
          cat > probe.mts <<'TS'
          import { gzipSync } from "node:zlib";
          import { webcamsFeed } from "./src/lib/feeds/webcams";
          import { toWebcam, webcamImage, WEBCAM_SOURCE_IDS } from "./src/lib/webcams";
          const t0 = Date.now();
          const r = await webcamsFeed.load(new URLSearchParams());
          console.log("load ms", Date.now() - t0, "unavailable", r.unavailable);
          const body = JSON.stringify(r);
          console.log("cams", r.cams.length, "raw KB", (body.length / 1024).toFixed(0), "gzip KB", (gzipSync(body).length / 1024).toFixed(0));
          for (const s of WEBCAM_SOURCE_IDS) {
            const rows = r.cams.filter((c) => c[0] === s);
            console.log(`\n== ${s}: ${rows.length}`);
            const pick = [rows[0], rows[Math.floor(rows.length / 2)], rows[rows.length - 1]].filter(Boolean);
            for (const row of pick) {
              const url = webcamImage(toWebcam(row!));
              const res = await fetch(url, { method: "GET" }).catch((e) => ({ status: String(e), headers: new Headers() }) as Response);
              console.log(JSON.stringify(row), "\n   ", res.status, res.headers.get("content-type"), res.headers.get("content-length"), url);
            }
          }
          const names = new Map<string, number>(); for (const c of r.cams) names.set(c[0] + c[1], (names.get(c[0] + c[1]) ?? 0) + 1);
          console.log("\nduplicate ids", [...names.values()].filter((n) => n > 1).length);
          TS
          npx --yes tsx probe.mts
