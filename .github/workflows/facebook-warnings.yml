# Warnings on the Storm Central Facebook Page (shorts/warning-posts.ts): every
# few minutes, the NWS's new Tornado Warnings, Extreme Wind Warnings, Flash
# Flood Emergencies and destructive Severe Thunderstorm Warnings go up as posts
# (upgrades post again), at most FB_POSTS_PER_HOUR an hour. The posted ones are
# kept in the Actions cache. GitHub's schedule is every 5 minutes at best and
# sometimes late; cron-job.org starts it every 3 minutes too (shorts/cron-job-org.ts).
#
# Needs the secret FB_PAGE_TOKEN, the Page's own token (shorts/README.md, Facebook); the Page is
# the token's, so FB_PAGE_ID is optional.
# Repository variables: FB_WARNINGS = false to pause it, FB_SEVERE = all for
# every Severe Thunderstorm Warning, FB_POSTS_PER_HOUR (default 12).
name: Facebook warnings

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post: post new warnings now · check: test the token (a hidden post, deleted at once) · dry-run: show what would be posted"
        type: choice
        options: [check, dry-run, post]
        default: check
      scheduled:
        description: Behave like a scheduled run (for an outside scheduler such as cron-job.org)
        type: boolean
        default: false

concurrency:
  # One run at a time, so two runs can't post the same warning.
  group: facebook-warnings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    if: (github.event_name == 'workflow_dispatch' && !inputs.scheduled) || vars.FB_WARNINGS != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.scheduled) && inputs.mode || 'post' }}
      HAS_PAGE: ${{ secrets.FB_PAGE_TOKEN != '' }}
      FB_STATE_DIR: shorts/.state
    steps:
      - name: Without the Page's secrets there's nothing to do
        if: env.HAS_PAGE != 'true' && env.MODE != 'dry-run'
        run: echo "::notice::Add the FB_PAGE_TOKEN secret to post warnings to Facebook (shorts/README.md)."
      - uses: actions/checkout@v5
        if: env.HAS_PAGE == 'true' || env.MODE == 'dry-run'
      - uses: actions/setup-node@v5
        if: env.HAS_PAGE == 'true' || env.MODE == 'dry-run'
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        if: env.HAS_PAGE == 'true' || env.MODE == 'dry-run'
        with:
          path: shorts/.state
          key: facebook-warnings-state-${{ github.run_id }}
          restore-keys: facebook-warnings-state-
      - name: Build
        if: env.HAS_PAGE == 'true' || env.MODE == 'dry-run'
        run: npx --yes esbuild@0.28.2 shorts/facebook-warnings.ts --bundle --platform=node --format=esm --target=node22 --outfile="$RUNNER_TEMP/fb.mjs" --log-level=warning
      - name: Post
        id: post
        if: env.HAS_PAGE == 'true' || env.MODE == 'dry-run'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_SEVERE: ${{ vars.FB_SEVERE }}
          FB_POSTS_PER_HOUR: ${{ vars.FB_POSTS_PER_HOUR }}
          FB_DRY_RUN: ${{ env.MODE == 'dry-run' && '1' || '' }}
        run: node "$RUNNER_TEMP/fb.mjs" ${{ env.MODE == 'check' && 'check' || '' }}
      - uses: actions/cache/save@v4
        # always(): a run where one post failed still records the ones it made.
        if: always() && env.MODE == 'post' && hashFiles('shorts/.state/facebook-warnings.json') != ''
        with:
          path: shorts/.state
          key: facebook-warnings-state-${{ github.run_id }}
