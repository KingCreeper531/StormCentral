# Temporary: is the Pro data server up, and is its data fresh? Removed after use.
name: Probe Pro server
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe-pro.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://pro.stormcentralwx.com/ https://pro.stormcentralwx.com/index.json; do
            curl -sS -o /dev/null -m 20 -w "$u -> HTTP %{http_code} in %{time_total}s\n" "$u" || echo "$u -> unreachable"
          done
          curl -fsS -m 20 https://pro.stormcentralwx.com/index.json -o index.json && python3 - <<'PY'
          import json, datetime as dt
          d = json.load(open("index.json"))
          now = dt.datetime.now(dt.timezone.utc)
          print("now", now.strftime("%Y-%m-%d %H:%M UTC"))
          prods = d.get("products", d) if isinstance(d, dict) else {}
          for name, p in (prods.items() if isinstance(prods, dict) else []):
              frames = p.get("frames", []) if isinstance(p, dict) else (p if isinstance(p, list) else [])
              if frames:
                  t = dt.datetime.fromisoformat(frames[-1]["time"].replace("Z", "+00:00"))
                  print(f"{name}: {len(frames)} frames, newest {t.strftime('%H:%M')} UTC ({(now - t).total_seconds() / 60:.0f} min ago)")
              else:
                  print(f"{name}: no frames")
          PY
