# TEMP: is there a Pro data server with GLM lightning (removed after the check).
name: Probe Pro server
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [.github/workflows/probe-pro.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look for it
        run: |
          for h in pro.stormcentralwx.com data.stormcentralwx.com radar.stormcentralwx.com; do
            echo "=== $h: A $(dig +short $h A @1.1.1.1 | tr '\n' ' ')"
            curl -sS -m 15 -o /tmp/l.json -w "lightning.json HTTP %{http_code}, %{size_download} bytes\n" "https://$h/lightning.json" || echo "(no answer)"
            [ -s /tmp/l.json ] && python3 -c "import json;d=json.load(open('/tmp/l.json'));print('generated', d.get('generated'), 'minutes', d.get('minutes'), 'flashes', len(d.get('flashes', [])))" 2>/dev/null || true
            rm -f /tmp/l.json
            curl -sS -m 15 -o /dev/null -w "index.json HTTP %{http_code}\n" "https://$h/index.json" || true
          done
