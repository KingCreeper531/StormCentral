name: TEMP AI narration previews
on:
  push:
    branches: [claude/trusting-pasteur-qzc0fq]
    paths: [".github/workflows/tmp-ai.yml"]
permissions:
  contents: write
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        model:
          - { tag: "gemma3:12b", slug: "gemma3-12b" }
          - { tag: "gemma4:12b", slug: "gemma4-12b" }
        kind: [outlook, recap, weekly, tropical, fire]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the renderer
        run: |
          npm install --prefix "$RUNNER_TEMP/shorts" --no-audit --no-fund playwright-core@1.56.1
          "$RUNNER_TEMP/shorts/node_modules/.bin/playwright-core" install --with-deps chromium || (sleep 20 && "$RUNNER_TEMP/shorts/node_modules/.bin/playwright-core" install --with-deps chromium)
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pipx install edge-tts==7.3.1
      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          ollama pull "${{ matrix.model.tag }}"
          nproc; free -g
      - name: Build
        run: npx --yes esbuild@0.28.2 shorts/main.ts --bundle --platform=node --format=esm --target=node22 --external:playwright-core --outfile="$RUNNER_TEMP/shorts/shorts.mjs" --log-level=warning
      - name: Make the Short
        env:
          SHORTS_KIND: ${{ matrix.kind }}
          SHORTS_UPLOAD: "0"
          SHORTS_LATEST: "1"
          SHORTS_WAIT_MIN: "0"
          SHORTS_AI: "true"
          SHORTS_AI_MODEL: ${{ matrix.model.tag }}
          SHORTS_AI_COMPARE: "1"
          SHORTS_TROPICAL_MAX: "1"
        run: |
          mkdir -p shorts/out
          node "$RUNNER_TEMP/shorts/shorts.mjs" 2>&1 | tee shorts/out/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-${{ matrix.model.slug }}-${{ matrix.kind }}
          path: shorts/out/
          retention-days: 3
  commit:
    needs: short
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: ai-*
          path: tmp-ai
      - name: Commit the videos and scripts to this branch
        run: |
          ls -R tmp-ai | head -100
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-ai
          git commit -m "TEMP: AI narration previews" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
